<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TUDLO: Kingdom of Knowledge</title>
<style>
:root{--ink:#2b1d0e;--parch:#fbf1d9;--parch2:#f3e2b8;--gold:#f2b632;--gold2:#c98a12;--navy:#14213d;--navy2:#22335c;--red:#d64541;--green:#2e9d5b;--blue:#3d7be8;--muted:#7a6a52;--shadow:0 6px 0 rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 50% -10%,#3a5199 0%,#1b2a52 45%,#0f1830 100%);min-height:100vh;-webkit-tap-highlight-color:transparent}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff9,transparent),radial-gradient(1px 1px at 30% 8%,#fff8,transparent),radial-gradient(1.5px 1.5px at 55% 15%,#fff7,transparent),radial-gradient(1px 1px at 75% 25%,#fff9,transparent),radial-gradient(1.5px 1.5px at 90% 10%,#fff8,transparent),radial-gradient(1px 1px at 45% 30%,#fff6,transparent);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:10px 12px 40px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:.2em 0 .4em;letter-spacing:.5px}
button{font-family:inherit;cursor:pointer;border:0}
.btn{background:linear-gradient(#ffd25e,var(--gold));color:#3a2408;font-weight:800;font-size:16px;padding:12px 18px;border-radius:14px;box-shadow:0 5px 0 var(--gold2),0 8px 14px rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold2)}
.btn.sec{background:linear-gradient(#fff,#e9dcc0);box-shadow:0 5px 0 #b9a47a;color:var(--ink)}
.btn.red{background:linear-gradient(#ff7a6b,var(--red));color:#fff;box-shadow:0 5px 0 #8e2622}
.btn.green{background:linear-gradient(#5fd38d,var(--green));color:#fff;box-shadow:0 5px 0 #1d6b3d}
.btn.blue{background:linear-gradient(#78a6ff,var(--blue));color:#fff;box-shadow:0 5px 0 #24529f}
.btn.sm{font-size:13px;padding:8px 12px;border-radius:10px}
.btn[disabled]{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.card{background:var(--parch);border-radius:18px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.22),inset 0 0 0 3px #e7cf98;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.muted{color:var(--muted)}
.white{color:#fff}
.center{text-align:center}
.pill{display:inline-block;background:#fff6;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
/* top bar */
.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:rgba(10,18,40,.7);backdrop-filter:blur(4px);border-radius:16px;padding:8px 10px;color:#fff;position:sticky;top:6px;z-index:20;box-shadow:0 4px 12px #0006}
.top .res{background:#ffffff14;border-radius:10px;padding:4px 8px;font-weight:800;font-size:14px;white-space:nowrap}
.top .who{font-weight:800;margin-right:auto;display:flex;align-items:center;gap:6px;cursor:pointer}
.lvl{background:var(--gold);color:#3a2408;border-radius:8px;padding:1px 7px;font-size:12px}
.xpbar{height:6px;width:90px;background:#ffffff22;border-radius:9px;overflow:hidden}.xpbar i{display:block;height:100%;background:var(--gold)}
.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25);background:#f2b63266}}
/* title */
.logo{font-family:Georgia,serif;font-size:min(16vw,92px);font-weight:900;color:var(--gold);text-shadow:0 5px 0 #8a5a00,0 10px 30px #000a;letter-spacing:6px;margin:10px 0 0}
.tag{color:#ffe9b0;font-size:18px;letter-spacing:2px}
.acr{color:#c9d6ff;font-size:13px}
.castleArt{font-size:70px;filter:drop-shadow(0 8px 8px #0008);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.crests button{font-size:30px;background:#fff;border-radius:12px;padding:6px 8px;margin:3px;border:3px solid transparent}
.crests button.on{border-color:var(--gold2);background:#fff3c4}
input.txt{font-size:18px;padding:10px 12px;border-radius:12px;border:3px solid #e1c98d;width:100%;background:#fffdf5}
/* kingdom scene */
.scene{position:relative;height:300px;border-radius:20px;overflow:hidden;background:linear-gradient(#8fd3ff 0%,#c7ecff 45%,#9bd36a 46%,#6fb64a 100%);box-shadow:0 8px 0 rgba(0,0,0,.25);margin-top:12px}
.scene .sun{position:absolute;right:30px;top:18px;font-size:44px;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;font-size:40px;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(1100px)}}
.hill{position:absolute;bottom:0;border-radius:50% 50% 0 0;background:#5ea83e}
.bslot{position:absolute;text-align:center;transform:translate(-50%,-100%);cursor:pointer;transition:transform .2s}
.bslot:hover{transform:translate(-50%,-104%)}
.bslot .ic{font-size:40px;line-height:1;filter:drop-shadow(0 4px 2px #0005)}
.bslot .lb{font-size:10px;font-weight:800;background:#fffd;border-radius:6px;padding:1px 5px;white-space:nowrap}
.bslot.locked .ic{filter:grayscale(1) opacity(.35)}
.bslot.new{animation:pop .8s}
@keyframes pop{0%{transform:translate(-50%,-100%) scale(0)}70%{transform:translate(-50%,-100%) scale(1.3)}}
.castle{position:absolute;left:50%;bottom:95px;transform:translateX(-50%);text-align:center}
.castle .ic{font-size:86px;filter:drop-shadow(0 6px 4px #0006)}
.flag{position:absolute;top:-18px;left:58%;font-size:26px;transform-origin:bottom left;animation:wave 1.2s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-12deg) skewX(8deg)}}
.march{position:absolute;bottom:8px;left:0;white-space:nowrap;font-size:22px;animation:march 18s linear infinite}
@keyframes march{from{transform:translateX(-60%)}to{transform:translateX(110%)}}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.mbtn{background:var(--parch);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:0 6px 0 #b9a47a,0 10px 18px #0004;font-weight:800;font-size:15px;color:var(--ink);transition:transform .1s;position:relative}
.mbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b9a47a}
.mbtn .ic{font-size:40px;display:block;margin-bottom:4px}
.mbtn small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:3px}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:99px;padding:2px 8px;font-size:12px;animation:bump 1.4s infinite}
.raid{background:linear-gradient(90deg,#7a1010,#c0392b);color:#fff;border-radius:16px;padding:12px 14px;margin-top:12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 0 #4a0a0a;animation:alarm 1.6s infinite}
@keyframes alarm{50%{box-shadow:0 6px 0 #4a0a0a,0 0 24px #ff5544}}
/* map */
.mapwrap{border-radius:20px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.25);background:#2a6d8f}
.map svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node.open circle.ring{animation:pulse 1.6s infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.25);opacity:.3}}
.path-anim{stroke-dasharray:10 10;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
/* territory */
.thead{border-radius:20px;padding:18px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.25);position:relative;overflow:hidden}
.thead .big{font-size:64px;position:absolute;right:16px;top:8px;animation:float 3s ease-in-out infinite}
.prog{height:14px;background:#0002;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7be3a1);transition:width .5s}
.lesson{background:#fffaf0;border-left:6px solid var(--gold);border-radius:12px;padding:10px 14px;line-height:1.55}
.lesson code,.qtext b{font-weight:800}
/* battle */
.bhead{display:flex;gap:8px;align-items:center;color:#fff;flex-wrap:wrap;margin:6px 0}
.bhead .t{font-weight:800;font-family:Georgia,serif;font-size:18px;margin-right:auto}
.arena{position:relative;height:190px;border-radius:20px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.arena .ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:#0002}
.army{position:absolute;left:12px;bottom:18px;display:flex;flex-wrap:wrap-reverse;width:44%;gap:2px;font-size:26px;transition:transform .2s}
.army span{animation:bob 1s ease-in-out infinite;display:inline-block}
.army span:nth-child(2n){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-3px)}}
.army.hurt{animation:hurt .5s}
@keyframes hurt{20%,60%{transform:translateX(-10px);filter:brightness(2) saturate(0)}40%{transform:translateX(6px)}}
.enemy{position:absolute;right:18px;bottom:16px;text-align:center;transition:transform .2s}
.enemy .em{font-size:76px;display:inline-block;filter:drop-shadow(0 6px 3px #0006);animation:idle 2s ease-in-out infinite}
.enemy.boss .em{font-size:96px}
@keyframes idle{50%{transform:translateY(-6px) scale(1.03)}}
.enemy .nm{background:#000a;color:#fff;font-weight:800;font-size:12px;border-radius:8px;padding:2px 8px;white-space:nowrap}
.hp{width:150px;height:12px;background:#0006;border-radius:9px;overflow:hidden;margin:4px auto 0;border:2px solid #000a}.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5e57,#ff9f43);transition:width .4s}
.enemy.hit .em{animation:hit .45s}
@keyframes hit{25%{transform:translateX(14px) rotate(8deg);filter:brightness(2.5) sepia(1) hue-rotate(-50deg) saturate(5)}60%{transform:translateX(-6px)}}
.enemy.lunge{animation:lunge .5s}
@keyframes lunge{40%{transform:translateX(-120px) scale(1.1)}}
.enemy.dead .em{animation:die 1.2s forwards}
@keyframes die{to{transform:rotate(90deg) translateY(40px);opacity:0;filter:grayscale(1)}}
.proj{position:absolute;font-size:30px;left:30%;bottom:60px;animation:fly .45s ease-in forwards;pointer-events:none}
@keyframes fly{from{transform:translateX(0) rotate(0)}to{transform:translateX(min(48vw,430px)) rotate(20deg)}}
.pop{position:absolute;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none;animation:up 1.1s ease-out forwards;white-space:nowrap}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.streakban{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:linear-gradient(#ffd25e,#f28c28);color:#3a1400;font-weight:900;font-size:20px;padding:6px 16px;border-radius:99px;box-shadow:0 4px 0 #9a4a00;animation:ban 1.8s forwards;white-space:nowrap}
@keyframes ban{0%{transform:translateX(-50%) scale(0)}15%{transform:translateX(-50%) scale(1.2)}25%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.qcard{background:var(--parch);border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 8px 0 rgba(0,0,0,.22),inset 0 0 0 3px #e7cf98}
.qtext{font-size:26px;font-weight:700;text-align:center;line-height:1.5;min-height:60px;padding:4px}
.qtext small{font-size:14px;font-weight:600;color:var(--muted)}
.retban{background:#3d7be8;color:#fff;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:800;display:inline-block;margin-bottom:6px}
.mtag{display:inline-block;background:#2e9d5b;color:#fff;border-radius:99px;padding:2px 10px;font-size:14px;margin-bottom:6px}
.seq{font-size:28px;letter-spacing:1px;margin-top:6px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 3px;font-size:.92em}
.fr span:first-child{border-bottom:3px solid currentColor;padding:0 4px}
.ask{max-width:460px;margin:8px auto 0}
.ansrow{display:flex;gap:8px}
.ans{flex:1;font-size:28px;font-weight:800;text-align:center;padding:8px;border-radius:14px;border:4px solid #e1c98d;background:#fff;min-width:0;color:var(--ink)}
.ans:focus{outline:none;border-color:var(--gold)}
.ans.shake{animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.pad button{background:#fff;border-radius:12px;font-size:22px;font-weight:800;padding:10px 0;box-shadow:0 4px 0 #c9b88f;color:var(--ink)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #c9b88f}
.pad button.op{background:#fff3c4}
.pad button.del{background:#ffe0dc}
.fb{min-height:24px;text-align:center;font-weight:800;margin-top:8px}
.fb.warn{color:#b26a00}.fb.bad{color:var(--red)}.fb.good{color:var(--green)}
.tools{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
/* modal */
#modal{position:fixed;inset:0;background:#0a1020cc;z-index:100;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px 10px}
#modal.on{display:flex}
#modal .box{background:var(--parch);border-radius:22px;max-width:760px;width:100%;padding:18px;box-shadow:0 10px 0 #0005,inset 0 0 0 4px #e7cf98;animation:mod .3s;margin:auto}
@keyframes mod{from{transform:scale(.85);opacity:0}}
.rhead{display:flex;align-items:center;gap:10px}
.rhead .ic{font-size:44px}
.stage{display:flex;gap:4px;margin:6px 0 10px;flex-wrap:wrap}
.stage span{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:#e9dcc0;color:#8a7756}
.stage span.on{background:var(--gold);color:#3a2408}.stage span.done{background:#bfe8cd;color:#1d6b3d}
.tabs{display:flex;gap:6px;margin:10px 0 0}
.tabs button{flex:1;padding:10px;border-radius:12px 12px 0 0;font-weight:800;background:#e9dcc0;color:#6a5a42;font-size:14px}
.tabs button.on{background:#fff;color:var(--ink)}
.tabc{background:#fff;border-radius:0 0 14px 14px;padding:12px 14px;line-height:1.6;font-size:16px}
.tabc ol,.tabc ul{padding-left:22px;margin:6px 0}
.tabc li{margin:4px 0}
.reveal{background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:17px}
.reveal .q{font-size:20px;font-weight:700}
.vis{margin:10px 0;padding:8px;background:#fdf6e6;border-radius:10px}
.vl{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.fbar{display:flex;gap:2px;margin:3px 0;max-width:420px}
.fbar i{flex:1;height:26px;background:#fff;border:2px solid #c98a12;border-radius:4px}
.fbar i.on{background:linear-gradient(#ffb74d,#f57c00)}
.drow{display:flex;gap:4px;margin:3px 0}.drow i{width:14px;height:14px;border-radius:50%;background:#3d7be8}
pre.col{font-family:Consolas,"Courier New",monospace;font-size:20px;background:#fdf6e6;padding:8px 14px;border-radius:10px;display:inline-block;margin:6px 0;line-height:1.3}
.nl{width:100%;max-width:520px;color:#3a2410}
.scl{width:100%;max-width:340px}
.jumps{font-size:20px;font-weight:700}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dots i{width:16px;height:16px;border-radius:50%;background:#e1d3b0;display:inline-block}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}.dots i.cur{background:var(--gold);transform:scale(1.2)}
.steplist{background:#fff;border-radius:14px;padding:10px 14px}
.steplist .st{padding:6px 0;border-bottom:1px dashed #e1d3b0;font-size:17px}
.steplist .st.done{color:#1d6b3d}
.steplist .st.cur{font-weight:800}
/* misc */
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#14213dee;color:#fff;font-weight:800;border-radius:99px;padding:8px 16px;box-shadow:0 4px 12px #0007;animation:toast 2.8s forwards;border:2px solid var(--gold)}
@keyframes toast{0%{transform:translateY(-20px);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:300;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
table.tb .btn{white-space:nowrap}.card:has(> table.tb){overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
.tb th{background:#e9dcc0;text-align:left;padding:7px}
.tb td{padding:6px 7px;border-top:1px solid #f0e6cf}
.tt{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;font-size:11px;font-weight:800;text-align:center;max-width:520px}
.tt div{padding:4px 0;border-radius:4px;background:#efe6d0}
.tt .h{background:#14213d;color:#fff}
.tt .m2{background:#5fd38d}.tt .m1{background:#ffe08a}.tt .mx{background:#ff9d8f}
.stars{color:var(--gold);font-size:18px;letter-spacing:1px;text-shadow:0 1px 0 #8a5a00}
.hero{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px;border:3px solid transparent}
.hero.on{border-color:var(--gold)}
.hero .ic{font-size:46px}
.hero.locked{opacity:.55;filter:grayscale(.8)}
.bld{background:#fff;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.bld .ic{font-size:42px}
.tag2{font-size:11px;font-weight:800;background:#e9dcc0;border-radius:6px;padding:1px 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{background:#fff;border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;font-weight:700;min-height:62px}
.cal div.today{outline:3px solid var(--gold)}
.cal div.done{background:#d8f3e2}
.cal b{display:block;font-size:20px}
.kid{font-family:"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",sans-serif}
.kid .top{position:sticky}
.kcard{padding:14px 10px}
.land{border-radius:18px;padding:10px;margin:10px 0;display:grid;gap:8px}
.knode{display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 5px 0 #cdb57c;font-size:17px;font-weight:800;color:var(--ink);font-family:inherit;width:100%}
.knode small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.knode .ic{font-size:38px}.knode .stars{font-size:16px;white-space:nowrap}
.knode.locked{opacity:.5;filter:grayscale(1)}
.knode.boss{background:linear-gradient(#fff,#ffe1dc)}
.knode.next{animation:glow 1.4s infinite;outline:3px solid var(--gold)}
@keyframes glow{50%{box-shadow:0 5px 0 #cdb57c,0 0 22px #ffcf40}}
.parade{min-height:34px;font-size:22px;text-align:center;margin:4px 0;word-break:break-all;line-height:1.2}
.parade .newk{animation:march-in .6s}
@keyframes march-in{from{transform:translateX(-40px);opacity:0}}
.kq{font-size:26px;font-weight:900;text-align:center;line-height:1.3}
.kq small{font-size:18px;color:var(--muted)}
.tiles{display:flex;justify-content:center;gap:20px;transition:gap .6s;margin:18px 0 12px}
.tiles.merged{gap:0}
.tile{font-size:min(15vw,80px);font-weight:900;background:#fff;border-radius:18px;padding:2px 14px;box-shadow:0 6px 0 #c9b88f;min-width:64px;text-align:center;color:#1f4e9e;transition:all .5s;cursor:pointer;line-height:1.15;font-family:inherit;position:relative}
.tile.t2{color:#d64541}.tile.t3{color:#2e9d5b}.tile.magic{color:#9b59b6}.tile sup{font-size:.35em;position:absolute;top:2px;right:2px}
.tile.on{background:#fff3a8;transform:translateY(-10px) scale(1.08)}
.tiles.merged .tile{border-radius:0;box-shadow:0 6px 0 #8fcf9f;background:#e9ffec;padding:2px 4px}
.tiles.merged .tile:first-child{border-radius:18px 0 0 18px;padding-left:16px}.tiles.merged .tile:last-child{border-radius:0 18px 18px 0;padding-right:16px}
.tile.sm{font-size:40px;min-width:58px;padding:2px 8px;color:#1f4e9e}
.tile.hint{animation:glow 1s infinite;background:#fff3a8}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:460px;margin:10px auto 0}
.pic{font-size:min(16vw,70px);background:#fff;border-radius:22px;padding:10px 0;box-shadow:0 6px 0 #c9b88f;line-height:1.2}
.pic:active,.kbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9b88f}
.pic.good,.kbtn.good,.chip.good{background:#c8f7d4!important;animation:bump .5s}
.pic.bad,.kbtn.bad,.chip.bad{background:#ffd5d0;animation:shake .4s}
.pic.bad,.kbtn.bad{opacity:.45}

<script>
// ================= TUDLO QUESTION ENGINE =================
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const rnd=x=>Math.round(x*1e6)/1e6;
const fmt=x=>{x=rnd(x);return (x<0?'−':'')+String(Math.abs(x))};
const sn=x=>x<0?`(−${rnd(-x)})`:`${rnd(x)}`;
const sg=x=>x<0?`− ${rnd(-x)}`:`+ ${rnd(x)}`;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const MX=(n,d)=>{if(d===1)return `${n}`;if(n%d===0)return `${n/d}`;if(n>d)return `${Math.floor(n/d)} ${F(n%d,d)}`;return F(n,d)};
const N=v=>({t:'num',v:rnd(v)});
const FR=(n,d,s)=>({t:'frac',n,d,simplest:!!s});
const RA=(a,b)=>({t:'ratio',a,b});
const PC=v=>({t:'pct',v:rnd(v)});
const PLACES=['ones','tens','hundreds','thousands','ten-thousands'];

function parseAns(s){
  s=String(s).trim().replace(/[₱,]/g,'').replace(/[−–]/g,'-').replace(/^[a-z]\s*=\s*/i,'').replace(/\s+/g,' ').trim();
  let pct=false; if(/%$/.test(s)){pct=true;s=s.slice(0,-1).trim()}
  let m;
  if((m=s.match(/^(-?\d+)\s*:\s*(-?\d+)$/)))return{kind:'ratio',a:+m[1],b:+m[2],v:+m[1]/+m[2]};
  if((m=s.match(/^(-?)(\d+) (\d+)\/(\d+)$/))){const g=m[1]?-1:1,w=+m[2],n=+m[3],d=+m[4];if(!d)return null;return{kind:'mixed',n:g*(w*d+n),d,fn:n,v:g*(w+n/d)}}
  if((m=s.match(/^(-?\d+)\/(-?\d+)$/))){const n=+m[1],d=+m[2];if(!d)return null;return{kind:'frac',n,d,v:n/d}}
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s))return{kind:'num',v:parseFloat(s)};
  return null;
}
const close=(a,b)=>Math.abs(a-b)<1e-6;
function specText(s){
  if(s.t==='text')return String(s.s);
  if(s.t==='num')return fmt(s.v);
  if(s.t==='pct')return fmt(s.v)+'%';
  if(s.t==='ratio')return `${s.a}:${s.b}`;
  if(s.t==='frac'){if(s.d===1)return `${s.n}`;if(s.n>s.d&&s.n%s.d)return `${s.n}/${s.d} (= ${Math.floor(s.n/s.d)} ${s.n%s.d}/${s.d})`;if(s.n%s.d===0)return `${s.n/s.d}`;return `${s.n}/${s.d}`}
}
function cleanTxt(x){return String(x).trim().replace(/^[a-z]\s*=\s*/i,'').replace(/\s*(cm|mm|m|km|kg|g|l|ml|cups?|pesos?|php|units?|hours?|hrs?|years?\s*old|years?|days?|weeks?|minutes?|mins?|pieces?|blocks?|sacks?|meters?|liters?)\.?$/i,'').trim()}
function checkAns(spec,input){
  if(spec.t==='text'){const a=parseAns(cleanTxt(input)),b=parseAns(cleanTxt(spec.s));
    if(a&&b&&a.kind==='ratio'&&b.kind==='ratio')return{res:a.a*b.b===a.b*b.a?'ok':'wrong'};
    if(a&&b&&a.kind!=='ratio'&&b.kind!=='ratio')return{res:close(a.v,b.v)?'ok':'wrong'};
    const nz=x=>String(x).toLowerCase().replace(/[−–]/g,'-').replace(/[₱,\s]/g,'').replace(/\.$/,'');return{res:nz(input)===nz(spec.s)?'ok':'wrong'}}
  const p=parseAns(input); if(!p)return{res:'invalid'};
  if(spec.t==='num')return{res:p.kind!=='ratio'&&close(p.v,spec.v)?'ok':'wrong'};
  if(spec.t==='pct')return{res:p.kind!=='ratio'&&close(p.v,spec.v)?'ok':'wrong'};
  if(spec.t==='ratio'){
    if(p.kind!=='ratio')return{res:'wrong'};
    if(p.a===spec.a&&p.b===spec.b)return{res:'ok'};
    if(p.b!==0&&p.a*spec.b===p.b*spec.a)return{res:'almost',msg:'Same ratio — but it can still be simplified. Divide both parts by their GCF.'};
    return{res:'wrong'};
  }
  if(spec.t==='frac'){
    if(p.kind==='ratio'||!close(p.v,spec.n/spec.d))return{res:'wrong'};
    if(spec.simplest){
      if(p.kind==='frac'&&gcd(p.n,p.d)!==1)return{res:'almost',msg:'Correct value — but simplify it all the way!'};
      if(p.kind==='mixed'&&gcd(p.fn,p.d)!==1)return{res:'almost',msg:'Correct value — but simplify the fraction part!'};
      if(p.kind==='num'&&!Number.isInteger(p.v))return{res:'almost',msg:'Write it as a fraction, like 3/4.'};
    }else if((p.kind==='frac'&&gcd(p.n,p.d)!==1)||(p.kind==='mixed'&&gcd(p.fn,p.d)!==1)){
      return{res:'ok',note:`Correct! Simplified, that is ${specText(spec)}.`};
    }
    return{res:'ok'};
  }
  return{res:'wrong'};
}

// ---------- visual helpers ----------
function fracBar(n,d,label){
  if(d>24||n>d*3)return'';
  let html='';const bars=Math.max(1,Math.ceil(n/d));
  for(let b=0;b<bars;b++){let cells='';for(let i=0;i<d;i++){cells+=`<i class="${b*d+i<n?'on':''}"></i>`}html+=`<div class="fbar">${cells}</div>`}
  return `<div class="vis">${label?`<div class="vl">${label}</div>`:''}${html}</div>`;
}
function dots(a,b){
  if(a>6||b>12)return'';
  let rows='';for(let i=0;i<a;i++){rows+=`<div class="drow">${'<i></i>'.repeat(b)}</div>`}
  return `<div class="vis"><div class="vl">${a} rows of ${b} soldiers</div>${rows}</div>`;
}
function numLine(a,b){
  const end=a+b;const lo=Math.min(a,end,0)-1,hi=Math.max(a,end,0)+1;
  if(hi-lo>34)return'';
  const W=520,pad=20,sx=v=>pad+(v-lo)*(W-2*pad)/(hi-lo);
  let t='';for(let v=lo;v<=hi;v++){t+=`<line x1="${sx(v)}" y1="58" x2="${sx(v)}" y2="${v===0?68:64}" stroke="currentColor" stroke-width="${v===0?2:1}"/>`;if((hi-lo)<=20||v%2===0||v===a||v===end)t+=`<text x="${sx(v)}" y="82" font-size="11" text-anchor="middle" fill="currentColor">${v<0?'−'+(-v):v}</text>`}
  const x1=sx(a),x2=sx(end),mid=(x1+x2)/2;
  return `<div class="vis"><div class="vl">Number line: start at ${fmt(a)}, move ${b>=0?'right':'left'} ${Math.abs(b)}</div><svg viewBox="0 0 ${W} 90" class="nl"><line x1="${pad}" y1="60" x2="${W-pad}" y2="60" stroke="currentColor" stroke-width="2"/>${t}<path d="M${x1} 56 Q${mid} ${10} ${x2} 56" fill="none" stroke="#e8a33d" stroke-width="3" marker-end="url(#ah)"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e8a33d"/></marker></defs><circle cx="${x1}" cy="60" r="5" fill="#3d7be8"/><circle cx="${x2}" cy="60" r="6" fill="#e84b3d"/></svg></div>`;
}
function scale(l,r){
  return `<div class="vis"><div class="vl">An equation is a balanced scale ⚖️</div><svg viewBox="0 0 320 120" class="scl"><polygon points="160,40 150,110 170,110" fill="#8b5a2b"/><line x1="40" y1="40" x2="280" y2="40" stroke="#8b5a2b" stroke-width="5"/><line x1="70" y1="40" x2="70" y2="62" stroke="#8b5a2b"/><line x1="250" y1="40" x2="250" y2="62" stroke="#8b5a2b"/><rect x="15" y="62" width="110" height="30" rx="6" fill="#f6e2b3" stroke="#8b5a2b"/><rect x="195" y="62" width="110" height="30" rx="6" fill="#f6e2b3" stroke="#8b5a2b"/><text x="70" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#3a2410">${l}</text><text x="250" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#3a2410">${r}</text></svg></div>`;
}
const pre=s=>`<pre class="col">${s}</pre>`;
function colAdd(a,b){
  const da=String(a).split('').reverse(),db=String(b).split('').reverse();let c=0,out=[];
  for(let i=0;i<Math.max(da.length,db.length);i++){const x=+(da[i]||0),y=+(db[i]||0),s=x+y+c;
    out.push(`<li><b>${cap(PLACES[i])}:</b> ${x} + ${y}${c?' + 1 (carried)':''} = ${s}${s>=10?` → write <b>${s%10}</b>, carry 1 to the ${PLACES[i+1]}`:` → write <b>${s}</b>`}</li>`);c=s>=10?1:0}
  if(c)out.push(`<li>Write the last carried <b>1</b> in front.</li>`);
  return `<ol>${out.join('')}</ol>`;
}
function colSub(a,b){
  const da=String(a).split('').reverse().map(Number),db=String(b).split('').reverse().map(Number);const out=[];
  for(let i=0;i<da.length;i++){const x=da[i],y=db[i]||0;
    if(x<y){let j=i+1;while(da[j]===0){da[j]=9;j++}da[j]--;out.push(`<li><b>${cap(PLACES[i])}:</b> ${x} − ${y}? Too small, so <b>borrow</b> 1 from the ${PLACES[i+1]} (it becomes 10 more): ${x+10} − ${y} = <b>${x+10-y}</b></li>`)}
    else if(!(i>=db.length&&i===da.length-1&&x===0))out.push(`<li><b>${cap(PLACES[i])}:</b> ${x} − ${y} = <b>${x-y}</b></li>`)}
  return `<ol>${out.join('')}</ol>`;
}
function alignDec(nums,op){
  const parts=nums.map(n=>{const s=String(rnd(n));const [i,f='']=s.split('.');return[i,f]});
  const fl=Math.max(...parts.map(p=>p[1].length)),il=Math.max(...parts.map(p=>p[0].length));
  const line=p=>p[0].padStart(il,' ')+(fl?'.'+p[1].padEnd(fl,'0'):'');
  return parts.map((p,i)=>(i===parts.length-1&&op?op+' ':'  ')+line(p)).join('\n');
}

// ---------- generator registry ----------
const G={};
function def(id,o){o.id=id;G[id]=o}
function makeQ(g,p,lv){const q=G[g].build(p,lv);q.g=g;q.p=p;q.lv=lv;q.topic=G[g].topic;return q}

// ===== MENTAL MATH =====
def('add',{topic:'Mental Addition',
  gen(lv){if(lv===1)return{a:R(11,89),b:R(3,9)};if(lv===2)return{a:R(15,89),b:R(12,89)};return{a:R(101,899),b:R(12,99)}},
  build({a,b}){const s=a+b,bT=b-b%10,bO=b%10;let adv,steps;
    if(bT>0){adv=`Split ${b} into ${bT} + ${bO}. First ${a} + ${bT} = ${a+bT}, then ${a+bT} + ${bO} = <b>${s}</b>.`;
      steps=[{q:`Add the tens first: ${a} + ${bT} = ?`,a:N(a+bT)},...(bO?[{q:`Now add the ones: ${a+bT} + ${bO} = ?`,a:N(s)}]:[])]}
    else{const need=(10-a%10)%10;
      if(need&&b>need){adv=`Make a ten! ${a} needs ${need} to reach ${a+need}. ${b} = ${need} + ${b-need}, so ${a+need} + ${b-need} = <b>${s}</b>.`;
        steps=[{q:`How much does ${a} need to reach ${a+need}?`,a:N(need)},{q:`${b} − ${need} = ? (what is left to add)`,a:N(b-need)},{q:`${a+need} + ${b-need} = ?`,a:N(s)}]}
      else{adv=`Count on from ${a}: ${b} more steps gives <b>${s}</b>.`;steps=[{q:`Ones: ${a%10} + ${b} = ?`,a:N(a%10+b)},{q:`${a-a%10} + ${a%10+b} = ?`,a:N(s)}]}}
    return{q:`${a} + ${b} = ?`,a:N(s),fmt:'number',hint:'Add tens first, then ones.',adv,
      det:`<p>Think of money: ${a} pesos is ${Math.floor(a/10)} ten-peso coins and ${a%10} one-peso coins. Add coins of the same kind together.</p>${pre(alignDec([a,b],'+')+'\n'+'-'.repeat(String(s).length+2)+'\n  '+s)}<p>Column method, right to left:</p>${colAdd(a,b)}<p>So ${a} + ${b} = <b>${s}</b>.</p>`,steps}}});

def('sub',{topic:'Mental Subtraction',
  gen(lv){let a,b;if(lv===1){a=R(20,99);b=R(3,9)}else if(lv===2){a=R(40,99);b=R(12,a-5)}else{a=R(120,999);b=R(25,a-10)}return{a,b}},
  build({a,b}){const s=a-b,bT=b-b%10,bO=b%10;let adv,steps;
    if(bT>0){adv=`Take away the tens first: ${a} − ${bT} = ${a-bT}. Then take away the ones: ${a-bT} − ${bO} = <b>${s}</b>. (Or count up from ${b} to ${a}.)`;
      steps=[{q:`${a} − ${bT} = ?`,a:N(a-bT)},...(bO?[{q:`${a-bT} − ${bO} = ?`,a:N(s)}]:[])]}
    else{const down=a%10;if(down&&b>down){adv=`Jump down to a ten: ${a} − ${down} = ${a-down}. You still need to take ${b-down} more: ${a-down} − ${b-down} = <b>${s}</b>.`;
        steps=[{q:`${a} − ${down} = ? (land on a ten)`,a:N(a-down)},{q:`${b} − ${down} = ? (still to take away)`,a:N(b-down)},{q:`${a-down} − ${b-down} = ?`,a:N(s)}]}
      else{adv=`Ones: ${a%10} − ${b} = ${a%10-b}, so the answer is <b>${s}</b>.`;steps=[{q:`${a%10} − ${b} = ?`,a:N(a%10-b)},{q:`${a-a%10} + ${a%10-b} = ?`,a:N(s)}]}}
    return{q:`${a} − ${b} = ?`,a:N(s),fmt:'number',hint:'Subtract the tens, then the ones.',adv,
      det:`<p>Imagine you have ₱${a} and you spend ₱${b}. How much is left?</p>${pre(alignDec([a,b],'−')+'\n'+'-'.repeat(String(a).length+2)+'\n'+String(s).padStart(String(a).length+2))}<p>Column method, right to left:</p>${colSub(a,b)}<p>Check by adding back: ${s} + ${b} = ${a} ✔. So the answer is <b>${s}</b>.</p>`,steps}}});

def('mul',{topic:'Multiplication',
  gen(lv){if(lv===1)return{a:R(2,5),b:R(2,10)};if(lv===2)return{a:R(3,9),b:R(3,12)};return pick([()=>({a:R(6,12),b:R(6,12)}),()=>({a:R(13,39),b:R(3,9)})])()},
  build({a,b}){const s=a*b;let adv,steps,split;
    if(a>12){const aT=a-a%10,aO=a%10;adv=`Split ${a} = ${aT} + ${aO}. ${aT} × ${b} = ${aT*b} and ${aO} × ${b} = ${aO*b}. Add: <b>${s}</b>.`;
      steps=[{q:`${aT} × ${b} = ?`,a:N(aT*b)},{q:`${aO} × ${b} = ?`,a:N(aO*b)},{q:`${aT*b} + ${aO*b} = ?`,a:N(s)}];split=`${a} = ${aT} + ${aO}`}
    else if(b>5){const b1=b>10?10:5,b2=b-b1;adv=`Split ${b} = ${b1} + ${b2}. ${a} × ${b1} = ${a*b1}, ${a} × ${b2} = ${a*b2}. Add: <b>${s}</b>.`;
      steps=[{q:`${a} × ${b1} = ?`,a:N(a*b1)},{q:`${a} × ${b2} = ?`,a:N(a*b2)},{q:`${a*b1} + ${a*b2} = ?`,a:N(s)}];split=`${b} = ${b1} + ${b2}`}
    else{adv=`${a} × ${b} means ${b} groups of ${a}: skip count by ${a} ${b} times → <b>${s}</b>.`;
      steps=[{q:`Skip count by ${a}: ${Array.from({length:Math.max(1,b-1)},(_,i)=>a*(i+1)).join(', ')}, … what comes next?`,a:N(b>1?s:a)}];if(b===1)steps=[{q:`Any number × 1 is itself. ${a} × 1 = ?`,a:N(a)}];split=''}
    return{q:`${a} × ${b} = ?`,a:N(s),fmt:'number',hint:split?`Try splitting: ${split}`:'Skip count!',adv,
      det:`<p>Multiplication is fast adding. ${a} × ${b} means <b>${a} rows of ${b} soldiers</b>.</p>${dots(Math.min(a,b),Math.max(a,b))}<p>Add the rows: ${a<=12&&a*b<=144&&a<=10?Array(a).fill(b).join(' + '):'(too many to draw)'} = <b>${s}</b>.</p>${split?`<p>Big trick — break it into easy parts (${split}) and add the pieces.</p>`:''}`,steps}}});

def('div',{topic:'Division',
  gen(lv){const b=lv===1?R(2,5):lv===2?R(3,9):R(6,12);const c=lv===3?R(4,12):R(2,10);return{b,c}},
  build({b,c}){const a=b*c;let steps;
    if(c>5){steps=[{q:`${b} × 5 = ?`,a:N(b*5)},{q:`${a} − ${b*5} = ? (what is left)`,a:N(a-b*5)},{q:`${a-b*5} ÷ ${b} = ?`,a:N(c-5)},{q:`5 + ${c-5} = ?`,a:N(c)}]}
    else steps=[{q:`Skip count by ${b} until you reach ${a}: ${Array.from({length:c},(_,i)=>b*(i+1)).join(', ')}. How many jumps?`,a:N(c)}];
    return{q:`${a} ÷ ${b} = ?`,a:N(c),fmt:'number',hint:`Think: ${b} × ? = ${a}`,
      adv:`Division is multiplication backwards. Ask: ${b} × ? = ${a}. Since ${b} × ${c} = ${a}, the answer is <b>${c}</b>.`,
      det:`<p>Share ${a} mangoes equally into ${b} baskets. How many mangoes go in each basket?</p>${dots(Math.min(b,6),c)}<p>Each round you put 1 mango in each basket — that uses ${b} mangoes. You can do it <b>${c}</b> rounds: ${Array(c).fill(b).join(' + ')} = ${a}.</p><p>So ${a} ÷ ${b} = <b>${c}</b>.</p>`,steps}}});

// ===== FRACTIONS =====
function properFrac(dmin,dmax){let d,n;do{d=R(dmin,dmax);n=R(1,d-1)}while(gcd(n,d)!==1);return[n,d]}
def('simp',{topic:'Simplifying Fractions',
  gen(lv){const[n,d]=properFrac(lv===1?2:3,lv===1?6:lv===2?9:12);const k=lv===1?R(2,4):lv===2?R(2,6):R(3,9);return{n,d,k}},
  build({n,d,k}){const N1=n*k,D1=d*k;
    return{q:`Simplify ${F(N1,D1)}`,a:FR(n,d,true),fmt:'fraction',hint:'Find a number that divides both top and bottom.',
      adv:`The GCF (greatest common factor) of ${N1} and ${D1} is ${k}. Divide both: ${N1} ÷ ${k} = ${n}, ${D1} ÷ ${k} = ${d}. Answer: <b>${n}/${d}</b>.`,
      det:`<p>Imagine a cake cut into ${D1} small slices, and you have ${N1} of them.</p>${fracBar(N1,D1,`${N1}/${D1}`)}<p>Now glue every ${k} small slices into one big slice. The cake now has ${D1} ÷ ${k} = ${d} big slices, and you own ${N1} ÷ ${k} = ${n} of them.</p>${fracBar(n,d,`${n}/${d}`)}<p>Same amount of cake — just fewer, bigger pieces. Steps:</p><ol><li>List numbers that divide ${N1}: ${divisors(N1).join(', ')}</li><li>List numbers that divide ${D1}: ${divisors(D1).join(', ')}</li><li>The biggest in both lists is <b>${k}</b>.</li><li>Divide top and bottom by ${k} → <b>${n}/${d}</b>.</li></ol>`,
      steps:[{q:`What is the biggest number that divides both ${N1} and ${D1}?`,a:N(k)},{q:`${N1} ÷ ${k} = ?`,a:N(n)},{q:`${D1} ÷ ${k} = ?`,a:N(d)},{q:`So ${F(N1,D1)} simplified is ?`,a:FR(n,d,true)}]}}});
function divisors(x){const r=[];for(let i=1;i<=x;i++)if(x%i===0)r.push(i);return r}

def('equiv',{topic:'Equivalent Fractions',
  gen(lv){const[n,d]=properFrac(2,lv===1?5:lv===2?8:12);return{n,d,k:R(2,lv===3?9:5)}},
  build({n,d,k}){return{q:`${F(n,d)} = ${F('?',d*k)}`,a:N(n*k),fmt:'number',hint:`How did ${d} become ${d*k}?`,
    adv:`The bottom was multiplied by ${k} (${d} × ${k} = ${d*k}). Do the same to the top: ${n} × ${k} = <b>${n*k}</b>.`,
    det:`<p>Equivalent fractions are the same amount, cut into a different number of pieces.</p>${fracBar(n,d,`${n}/${d}`)}${fracBar(n*k,d*k,`${n*k}/${d*k}`)}<p>Each of the ${d} pieces was cut into ${k} smaller pieces. So the ${n} shaded pieces become ${n} × ${k} = <b>${n*k}</b> small pieces.</p>`,
    steps:[{q:`${d} × ? = ${d*k}`,a:N(k)},{q:`Do the same to the top: ${n} × ${k} = ?`,a:N(n*k)}]}}});

def('fadd',{topic:'Adding & Subtracting Fractions',
  gen(lv){let n1,d1,n2,d2,op=pick(['+','−']);
    if(lv===1){d1=d2=R(3,12);n1=R(1,d1-1);n2=R(1,d1-1);if(n1===n2)n2=n1===1?2:n1-1}
    else if(lv===2){[n1,d1]=properFrac(2,6);d2=d1*R(2,3);n2=R(1,d2-1)}
    else{do{[n1,d1]=properFrac(2,9);[n2,d2]=properFrac(2,9)}while(d1===d2||d1%d2===0||d2%d1===0||lcm(d1,d2)>45)}
    if(Math.random()<.5&&lv>1){[n1,n2]=[n2,n1];[d1,d2]=[d2,d1]}
    if(op==='−'&&n1/d1<n2/d2){[n1,n2]=[n2,n1];[d1,d2]=[d2,d1]}
    if(n1*d2===n2*d1)op='+';
    return{n1,d1,n2,d2,op}},
  build({n1,d1,n2,d2,op}){const L=lcm(d1,d2),m1=L/d1,m2=L/d2,A=n1*m1,B=n2*m2,S=op==='+'?A+B:A-B,g=gcd(S,L),rn=S/g,rd=L/g,plus=op==='+';
    const same=d1===d2;const ans=`${MX(rn,rd)}`;
    const steps=same?[{q:`The bottoms are the same. ${plus?'Add':'Subtract'} the tops: ${n1} ${op} ${n2} = ?`,a:N(S)},{q:`Keep the bottom ${L}. Write the answer (simplify if you can):`,a:FR(rn,rd,false)}]
      :[{q:`Find the smallest common bottom (LCD) of ${d1} and ${d2}:`,a:N(L)},{q:`${F(n1,d1)} = ${F('?',L)}`,a:N(A)},{q:`${F(n2,d2)} = ${F('?',L)}`,a:N(B)},{q:`${A} ${op} ${B} = ?`,a:N(S)},{q:`So the answer is ${F(S,L)}. Write it in simplest form:`,a:FR(rn,rd,false)}];
    return{q:`${F(n1,d1)} ${op} ${F(n2,d2)} = ?`,a:FR(rn,rd,false),fmt:'fraction',hint:same?'Same bottoms: work with the tops only.':'Make the bottoms the same first.',
      adv:same?`The denominators are the same, so just ${plus?'add':'subtract'} the numerators: ${n1} ${op} ${n2} = ${S}. Result: ${F(S,L)}${g>1||S>=L?` = <b>${ans}</b>`:''}.`
        :`LCD of ${d1} and ${d2} is ${L}. ${F(n1,d1)} = ${F(A,L)} and ${F(n2,d2)} = ${F(B,L)}. Then ${A} ${op} ${B} = ${S} → ${F(S,L)}${g>1||S>=L?` = <b>${ans}</b>`:''}.`,
      det:same?`<p>Think of a pizza cut into ${L} equal slices.</p>${fracBar(n1,d1,`You have ${n1}/${d1}`)}${fracBar(n2,d2,`${plus?'You get':'You give away'} ${n2}/${d2}`)}<p>The slices are the same size, so just count: ${n1} ${op} ${n2} = ${S} slices out of ${L} → ${F(S,L)}.</p>${g>1?`<p>${S} and ${L} can both be divided by ${g}, so it simplifies to <b>${ans}</b>.</p>`:S>=L?`<p>That is <b>${ans}</b>.</p>`:''}<p>Remember: <b>never add the bottoms</b>. The bottom only tells the slice size!</p>`
        :`<p>You can only ${plus?'add':'subtract'} slices of the <b>same size</b>. ${F(1,d1)} and ${F(1,d2)} are different sizes, so first cut both pizzas into ${L} equal slices.</p><ol><li>Multiples of ${d1}: ${Array.from({length:L/d1+1},(_,i)=>d1*(i+1)).join(', ')}. Multiples of ${d2}: ${Array.from({length:L/d2+1},(_,i)=>d2*(i+1)).join(', ')}. The first one in both lists is <b>${L}</b>.</li><li>${F(n1,d1)}: multiply top and bottom by ${m1} → ${F(A,L)}</li><li>${F(n2,d2)}: multiply top and bottom by ${m2} → ${F(B,L)}</li><li>Now same-size slices: ${A} ${op} ${B} = ${S} → ${F(S,L)}</li>${g>1||S>=L?`<li>Simplify: <b>${ans}</b></li>`:''}</ol>${fracBar(A,L,`${A}/${L}`)}${fracBar(B,L,`${B}/${L}`)}`,
      steps}}});

// ===== DECIMALS =====
const fD=h=>fmt(h/100);
def('dadd',{topic:'Decimal Addition',
  gen(lv){if(lv===1)return{A:R(11,99)*10,B:R(11,99)*10};if(lv===2)return{A:R(101,999),B:R(11,99)*10};return{A:R(1001,9999),B:R(101,999)}},
  build({A,B}){const S=A+B;return{q:`${fD(A)} + ${fD(B)} = ?`,a:N(S/100),fmt:'decimal',hint:'Line up the decimal points.',
    adv:`Line up the decimal points and add like whole numbers: ${fD(A)} + ${fD(B)} = <b>${fD(S)}</b>.`,
    det:`<p>Think of money! ₱${(A/100).toFixed(2)} + ₱${(B/100).toFixed(2)}. Change both to centavos: ${A} centavos + ${B} centavos = ${S} centavos = <b>₱${(S/100).toFixed(2)}</b>.</p>${pre(alignDec([A/100,B/100],'+')+'\n'+'-'.repeat(alignDec([A/100],'').length+1)+'\n  '+alignDec([S/100],'').trim())}<p>Rule: the decimal points must stand in one straight line, like soldiers in formation. Fill empty spaces with zeros.</p>`,
    steps:[{q:`Change to hundredths (centavos): ${fD(A)} = ? hundredths`,a:N(A)},{q:`${fD(B)} = ? hundredths`,a:N(B)},{q:`${A} + ${B} = ?`,a:N(S)},{q:`${S} hundredths as a decimal = ?`,a:N(S/100)}]}}});
def('dsub',{topic:'Decimal Subtraction',
  gen(lv){let A,B;if(lv===1){A=R(30,99)*10;B=R(11,A/10-5)*10}else if(lv===2){A=R(300,999);B=R(11,A/10-3)*10}else{A=R(1500,9999);B=R(101,A-200)}return{A,B}},
  build({A,B}){const S=A-B;return{q:`${fD(A)} − ${fD(B)} = ?`,a:N(S/100),fmt:'decimal',hint:'Line up the decimal points.',

def('dmul',{topic:'Decimal Multiplication',

def('ddiv',{topic:'Decimal Division',
  gen(lv){if(lv===1){const d=R(2,9),Qt=R(11,49);return{E:d*Qt,Dt:d*10}}if(lv===2){const Dt=R(2,9),q=R(2,15);return{E:Dt*q,Dt}}const Dt=R(11,25),q=R(2,9);return{E:Dt*q,Dt}},

def('p2f',{topic:'Percent → Fraction',

function pofParams(lv){const p=lv===1?pick([10,50,25]):lv===2?pick([20,30,40,75,5]):pick([15,35,45,60,12*5,85,95,65]);let N=R(1,lv===1?10:lv===2?25:40)*20;return{p,N}}
function pofSteps(p,N){const part=p*N/100;const s=[{q:`10% of ${N} = ${N} ÷ 10 = ?`,a:N_(N/10)}];
  if(p%10===0)s.push({q:`${p}% is ${p/10} groups of 10%: ${p/10} × ${fmt(N/10)} = ?`,a:N_(part)});
  else s.push({q:`5% is half of 10%: ${fmt(N/10)} ÷ 2 = ?`,a:N_(N/20)},{q:`${p}% is ${p/5} groups of 5%: ${p/5} × ${fmt(N/20)} = ?`,a:N_(part)});return s}
const N_=N;
function pofAdv(p,N){const part=p*N/100;const fr={50:'1/2',25:'1/4',75:'3/4',20:'1/5',10:'1/10'}[p];
  return fr?`${p}% = ${fr}. ${fr} of ${N} = <b>${fmt(part)}</b>.`:`${p}% of ${N} = ${p/100} × ${N} = <b>${fmt(part)}</b>. (Shortcut: 10% = ${fmt(N/10)}${p%10?`, 5% = ${fmt(N/20)}`:''}.)`}
function pofDet(p,N,thing){const part=p*N/100;
  return `<p>Percent means "out of 100". ${p}% of ${N} means: for every 100, take ${p}.</p><p><b>The 10% trick</b> (works for everything!):</p><ol><li>10% = divide by 10 → ${N} ÷ 10 = <b>${fmt(N/10)}</b>${thing?' '+thing:''}</li>${p%10===0?`<li>${p}% = ${p/10} × 10% = ${p/10} × ${fmt(N/10)} = <b>${fmt(part)}</b></li>`:`<li>5% = half of 10% = <b>${fmt(N/20)}</b></li><li>${p}% = ${p/5} × 5% = ${p/5} × ${fmt(N/20)} = <b>${fmt(part)}</b></li>`}</ol>`}
def('pof',{topic:'Percent of a Number',gen:pofParams,

function intAddSteps(a,b){const s=a+b;if(a===0||b===0)return[{q:`Adding 0 changes nothing: answer = ?`,a:N(s)}];
  if((a<0)===(b<0))return[{q:`Same signs. Add the sizes: ${Math.abs(a)} + ${Math.abs(b)} = ?`,a:N(Math.abs(a)+Math.abs(b))},{q:`Keep the shared sign (${a<0?'negative':'positive'}). Answer = ?`,a:N(s)}];
  const big=Math.max(Math.abs(a),Math.abs(b)),sm=Math.min(Math.abs(a),Math.abs(b)),bs=Math.abs(a)>Math.abs(b)?a:b;
  return[{q:`Different signs. Subtract the sizes: ${big} − ${sm} = ?`,a:N(big-sm)},{q:`The bigger size (${big}) is ${bs<0?'negative':'positive'}, so the answer = ?`,a:N(s)}]}
def('int',{topic:'Integer Operations',
  gen(lv){const op=lv===1?pick(['+','−']):pick(['+','−','×','÷']);const M=lv===1?10:lv===2?15:25;let a,b;
    do{if(op==='×'){a=R(-12,12);b=R(-9,9)}else if(op==='÷'){b=R(-9,9)||2;const c=R(-12,12)||3;a=b*c}else{a=R(-M,M);b=R(-M,M)}}while(a===0||b===0||(a>0&&b>0));
    return{a,b,op}},
  build({a,b,op}){const ans=op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:a/b;let steps,adv,det;const A=fmt(a);
    if(op==='+'||op==='−'){const b2=op==='+'?b:-b;steps=(op==='−'?[{q:`Subtracting is adding the opposite: ${A} − ${sn(b)} = ${A} + ?`,a:N(-b)}]:[]).concat(intAddSteps(a,b2));
      adv=(op==='−'?`Change to adding the opposite: ${A} − ${sn(b)} = ${A} + ${sn(-b)}. `:'')+((a<0)===(b2<0)?`Same signs → add sizes, keep the sign: <b>${fmt(ans)}</b>.`:`Different signs → subtract sizes, take the sign of the bigger size: <b>${fmt(ans)}</b>.`);
      det=`<p>Think of temperature on a cold mountain 🏔️. Positive = warmer, negative = colder (below zero).</p><p>Start at ${A}°. ${op==='+'?(b>0?`It gets ${b}° warmer`:`It gets ${-b}° colder`):(b>0?`Take away ${b}° of warmth — it gets ${b}° colder`:`Take away ${-b}° of cold — that makes it ${-b}° warmer`)}.</p>${numLine(a,b2)}<p>You land on <b>${fmt(ans)}</b>.</p>${op==='−'?`<p>Rule: <b>subtracting a number = adding its opposite</b>. "Minus a negative" becomes plus.</p>`:''}`}
    else{steps=[{q:`Ignore the signs: ${Math.abs(a)} ${op} ${Math.abs(b)} = ?`,a:N(Math.abs(ans))},{q:`Signs are ${(a<0)===(b<0)?'the SAME → positive':'DIFFERENT → negative'}. Answer = ?`,a:N(ans)}];
      adv=`${Math.abs(a)} ${op} ${Math.abs(b)} = ${Math.abs(ans)}. ${(a<0)===(b<0)?'Same signs give a positive':'Different signs give a negative'}: <b>${fmt(ans)}</b>.`;
      det=`<p>Two-step method:</p><ol><li>Do the math with no signs: ${Math.abs(a)} ${op} ${Math.abs(b)} = ${Math.abs(ans)}</li><li>Decide the sign with the <b>sign rule</b>:<br>(+)${op}(+) = + &nbsp; (−)${op}(−) = + &nbsp; (+)${op}(−) = − &nbsp; (−)${op}(+) = −</li></ol><p>Story: ${op==='×'?`owing ₱${Math.abs(b)} to ${Math.abs(a)} friends means your money changes by −${Math.abs(a*b)}. Removing debts (− × −) makes you richer (+).`:`sharing a debt of ₱${Math.abs(a)} among ${Math.abs(b)} people: each person owes ${Math.abs(ans)}.`}</p><p>Here the signs are ${(a<0)===(b<0)?'the same':'different'}, so the answer is <b>${fmt(ans)}</b>.</p>`}
    return{q:`${A} ${op} ${sn(b)} = ?`,a:N(ans),fmt:'integer',hint:op==='+'||op==='−'?'Picture a number line or a thermometer.':'Same signs → positive. Different signs → negative.',adv,det,steps}}});

def('rsimp',{topic:'Simplifying Ratios',
  gen(lv){let x,y;do{x=R(1,lv===1?5:9);y=R(1,lv===1?5:9)}while(gcd(x,y)!==1||x===y);return{x,y,k:R(2,lv===3?12:6),c:R(0,4)}},
  build({x,y,k,c}){const a=x*k,b=y*k;const ctx=[`There are ${a} boys and ${b} girls in class. Write the ratio of boys to girls in simplest form.`,`A recipe uses ${a} cups of flour to ${b} cups of sugar. Simplify the ratio flour : sugar.`,`Simplify the ratio ${a} : ${b}.`,`A farm has ${a} chickens and ${b} ducks. Ratio of chickens to ducks (simplest form)?`,`Mortar mix: ${a} buckets of sand to ${b} buckets of cement. Simplest ratio?`][c];
    return{q:ctx,a:RA(x,y),fmt:'ratio',hint:'Divide both parts by the same biggest number.',
      adv:`GCF of ${a} and ${b} is ${k}. ${a} ÷ ${k} : ${b} ÷ ${k} = <b>${x}:${y}</b>.`,
      det:`<p>A ratio compares two amounts. ${a} : ${b} means "for every ${a} of the first, there are ${b} of the second".</p><p>Put them into equal teams! The biggest team size that divides both is <b>${k}</b>.</p><ol><li>${a} ÷ ${k} = ${x} teams</li><li>${b} ÷ ${k} = ${y} teams</li><li>So the ratio is <b>${x} : ${y}</b> — for every ${x} of the first, there are ${y} of the second.</li></ol><p>Type it like <b>${x}:${y}</b></p>`,
      steps:[{q:`Biggest number that divides both ${a} and ${b}?`,a:N(k)},{q:`${a} ÷ ${k} = ?`,a:N(x)},{q:`${b} ÷ ${k} = ?`,a:N(y)},{q:`So the simplest ratio is ? (type like 2:3)`,a:RA(x,y)}]}}});
def('rmiss',{topic:'Equivalent Ratios',
  gen(lv){return{x:R(1,lv===1?6:9),y:R(1,lv===1?6:12),k:R(2,lv===1?5:10),f:R(0,1)}},
  build({x,y,k,f}){const q=f?`${x} : ${y} = ${x*k} : ?`:`${x} : ${y} = ? : ${y*k}`,ans=f?y*k:x*k;
    return{q:`Find the missing number: ${q}`,a:N(ans),fmt:'number',hint:'What was the known part multiplied by?',
      adv:`${f?`${x} × ${k} = ${x*k}`:`${y} × ${k} = ${y*k}`}, so multiply the other part by ${k} too: <b>${ans}</b>.`,
      det:`<p>Equivalent ratios grow together, like a recipe for more people. If you multiply one part, you must multiply the other part by the <b>same</b> number.</p><ol><li>${f?`${x} became ${x*k}`:`${y} became ${y*k}`}: that is × <b>${k}</b></li><li>So ${f?y:x} × ${k} = <b>${ans}</b></li></ol>`,
      steps:[{q:`${f?x:y} × ? = ${f?x*k:y*k}`,a:N(k)},{q:`${f?y:x} × ${k} = ?`,a:N(ans)}]}}});

def('rword',{topic:'Proportion Problems',
  gen(lv){return RW[R(0,RW.length-1)](lv)},
  build(P){let q,ans,steps,adv,det;
    if(P.t===0){const{u,m,n}=P;q=`🍚 ${u*m} cups of rice feed ${m} people. How many cups are needed for ${n} people?`;ans=u*n;
      steps=[{q:`Cups for 1 person: ${u*m} ÷ ${m} = ?`,a:N(u)},{q:`Cups for ${n} people: ${u} × ${n} = ?`,a:N(ans)}];adv=`Unit rate: ${u*m} ÷ ${m} = ${u} cup${u>1?'s':''} per person. × ${n} = <b>${ans}</b> cups.`;
      det=`<p>Scaling a recipe: first find how much ONE person needs (the <b>unit rate</b>), then multiply.</p><ol><li>${u*m} cups shared by ${m} people → each gets ${u*m} ÷ ${m} = <b>${u}</b></li><li>${n} people × ${u} = <b>${ans}</b> cups</li></ol><p>Proportion way: ${u*m}/${m} = ?/${n}</p>`}
    else if(P.t===1){const{u,n,s}=P;q=`🗺️ On a map, ${s} cm stands for ${u*s} km. Two towns are ${n*s} cm apart on the map. What is the real distance in km?`;ans=u*n*s;
      steps=s>1?[{q:`1 cm stands for ${u*s} ÷ ${s} = ? km`,a:N(u)},{q:`${n*s} cm × ${u} = ? km`,a:N(ans)}]:[{q:`${n} × ${u} = ?`,a:N(ans)}];adv=`Scale: 1 cm = ${u} km. ${n*s} × ${u} = <b>${ans}</b> km.`;
      det=`<p>A map scale is a ratio. Find what <b>1 cm</b> means first.</p><ol>${s>1?`<li>${s} cm = ${u*s} km, so 1 cm = ${u*s} ÷ ${s} = <b>${u}</b> km</li>`:`<li>1 cm = ${u} km</li>`}<li>The towns are ${n*s} cm apart → ${n*s} × ${u} = <b>${ans}</b> km</li></ol>`}
    else if(P.t===2){const{r,c,q:qq}=P;const cem=c*qq;q=`🏗️ A concrete mix uses cement : sand = ${qq} : ${r*qq===r*qq?r*1:r}${qq>1?'':''}. `;
      const sr=qq===1?r:r*1;q=`🏗️ A concrete mix uses cement and sand in the ratio ${qq} : ${qq*r}. If you use ${cem} bags of cement, how many bags of sand do you need?`;ans=cem*r;
      steps=[{q:`For each bag of cement, how many bags of sand? ${qq*r} ÷ ${qq} = ?`,a:N(r)},{q:`${cem} × ${r} = ?`,a:N(ans)}];adv=`Sand is ${r} times the cement. ${cem} × ${r} = <b>${ans}</b> bags.`;
      det=`<p>The ratio ${qq} : ${qq*r} says sand is always <b>${r} times</b> as much as cement.</p><ol><li>${qq*r} ÷ ${qq} = ${r}</li><li>${cem} bags of cement × ${r} = <b>${ans}</b> bags of sand</li></ol>`}
    else if(P.t===3){const{p,q:qq,u}=P,T=(p+qq)*u;const big=Math.max(p,qq)*u;q=`💰 Two siblings share ₱${T} in the ratio ${p} : ${qq}. How much does the one with the BIGGER share get?`;ans=big;
      steps=[{q:`Total parts: ${p} + ${qq} = ?`,a:N(p+qq)},{q:`One part = ${T} ÷ ${p+qq} = ?`,a:N(u)},{q:`Bigger share = ${Math.max(p,qq)} × ${u} = ?`,a:N(big)}];adv=`${p}+${qq} = ${p+qq} parts. One part = ₱${u}. Bigger share = ${Math.max(p,qq)} × ${u} = <b>₱${big}</b>.`;
      det=`<p>Imagine the money cut into equal envelopes. One sibling gets ${p} envelopes, the other gets ${qq}.</p><ol><li>Total envelopes: ${p} + ${qq} = <b>${p+qq}</b></li><li>Each envelope: ₱${T} ÷ ${p+qq} = <b>₱${u}</b></li><li>Bigger share: ${Math.max(p,qq)} envelopes × ₱${u} = <b>₱${big}</b></li></ol>`}
    else{const{u,m,n}=P;q=`🥖 ${m} pieces of pandesal cost ₱${u*m}. How much do ${n} pieces cost?`;ans=u*n;
      steps=[{q:`Price of 1 piece: ${u*m} ÷ ${m} = ?`,a:N(u)},{q:`${n} × ${u} = ?`,a:N(ans)}];adv=`₱${u*m} ÷ ${m} = ₱${u} each. ${n} × ${u} = <b>₱${ans}</b>.`;
      det=`<p>Find the price of ONE first (unit price).</p><ol><li>₱${u*m} ÷ ${m} = <b>₱${u}</b> per piece</li><li>${n} pieces × ₱${u} = <b>₱${ans}</b></li></ol>`}
    return{q,a:N(ans),fmt:'number',hint:'Find the amount for ONE first.',adv,det,steps}}});

// ===== PATTERNS =====
function arTerms(s,d,n){return Array.from({length:n},(_,i)=>s+i*d)}
def('seqnext',{topic:'Number Patterns',
  gen(lv){if(lv===1)return{k:'ar',s:R(1,20),d:R(2,10)};if(lv===2)return pick([{k:'ar',s:R(40,90),d:-R(2,9)},{k:'ar',s:R(1,30),d:R(6,15)}]);return pick([{k:'geo',s:R(1,5),d:pick([2,3])},{k:'sq',s:R(1,6),d:0},{k:'ar',s:R(-10,10),d:pick([-7,-4,-3,3,4,7])}])},
  build({k,s,d}){let t,nx,steps,adv,det;
    if(k==='ar'){t=arTerms(s,d,5);nx=s+5*d;steps=[{q:`${fmt(t[1])} − ${sn(t[0])} = ?`,a:N(d)},{q:`Check: ${fmt(t[2])} − ${sn(t[1])} = ?`,a:N(d)},{q:`Next = ${fmt(t[4])} ${sg(d)} = ?`,a:N(nx)}];
      adv=`The rule is "${d>0?'add '+d:'subtract '+(-d)}" each time. ${fmt(t[4])} ${sg(d)} = <b>${fmt(nx)}</b>.`;
      det=`<p>Be a detective 🔍. Look at how each number changes to the next:</p><p class="jumps">${t.map(fmt).join(' → ')}</p><p>Each jump is ${d>0?'+':'−'}${Math.abs(d)}: ${t.slice(1).map((v,i)=>`${fmt(t[i])}→${fmt(v)}`).join(', ')}.</p><p>So the rule is <b>${d>0?'add '+d:'subtract '+(-d)}</b>. Next: ${fmt(t[4])} ${sg(d)} = <b>${fmt(nx)}</b>.</p>`}
    else if(k==='geo'){t=Array.from({length:5},(_,i)=>s*d**i);nx=s*d**5;steps=[{q:`${t[1]} ÷ ${t[0]} = ?`,a:N(d)},{q:`Next = ${t[4]} × ${d} = ?`,a:N(nx)}];
      adv=`Each number is multiplied by ${d}. ${t[4]} × ${d} = <b>${nx}</b>.`;
      det=`<p>The differences keep growing (${t[1]-t[0]}, ${t[2]-t[1]}, ${t[3]-t[2]}…), so it is not adding. Try dividing neighbors:</p><p>${t[1]} ÷ ${t[0]} = ${d}, ${t[2]} ÷ ${t[1]} = ${d}. The rule is <b>× ${d}</b>.</p><p>Next: ${t[4]} × ${d} = <b>${nx}</b>. (Like a rumor spreading — each person tells ${d} more!)</p>`}
    else{t=Array.from({length:5},(_,i)=>(s+i)**2);nx=(s+5)**2;const dd=t.slice(1).map((v,i)=>v-t[i]);const nd=dd[3]+2;
      steps=[{q:`Differences: ${t[1]}−${t[0]} = ${dd[0]}, ${t[2]}−${t[1]} = ${dd[1]}, ${t[3]}−${t[2]} = ${dd[2]}, ${t[4]}−${t[3]} = ?`,a:N(dd[3])},{q:`The differences grow by 2. Next difference = ?`,a:N(nd)},{q:`${t[4]} + ${nd} = ?`,a:N(nx)}];
      adv=`These are square numbers: ${s}², ${s+1}², … Next is ${s+5}² = <b>${nx}</b>.`;
      det=`<p>Look at the jumps: ${dd.join(', ')}. The jumps themselves grow by 2!</p><p>Next jump = ${dd[3]} + 2 = ${nd}. So ${t[4]} + ${nd} = <b>${nx}</b>.</p><p>Secret: these are <b>square numbers</b> (${s}×${s}, ${s+1}×${s+1}, …) — soldiers arranged in square formations.</p>`}
    return{q:`What comes next?<div class="seq">${t.map(fmt).join(', ')}, <b>?</b></div>`,a:N(nx),fmt:'integer',hint:'Find what changes from one number to the next.',adv,det,steps}}});
def('seqmiss',{topic:'Missing Numbers',
  gen(lv){return{s:lv===3?R(-20,20):R(1,30),d:lv===1?R(2,8):lv===2?pick([R(3,12),-R(2,8)]):pick([-9,-6,-4,4,6,9,11]),pos:R(1,4)}},
  build({s,d,pos}){const t=arTerms(s,6==6?6:6,0);const T=arTerms(s,d,6);const j=pos>=3?0:4;const ans=T[pos];
    return{q:`Find the missing number:<div class="seq">${T.map((v,i)=>i===pos?'<b>?</b>':fmt(v)).join(', ')}</div>`,a:N(ans),fmt:'integer',hint:'Use two neighbors you can see to find the rule.',
      adv:`From ${fmt(T[j])} to ${fmt(T[j+1])} the change is ${d>0?'+':'−'}${Math.abs(d)}. So the missing number is ${fmt(T[pos-1])} ${sg(d)} = <b>${fmt(ans)}</b>.`,
      det:`<p>Find two numbers that sit side by side with no gap: <b>${fmt(T[j])}</b> and <b>${fmt(T[j+1])}</b>.</p><p>${fmt(T[j+1])} − ${sn(T[j])} = ${d}. The rule is <b>${d>0?'add '+d:'subtract '+(-d)}</b>.</p><p>The number before the gap is ${fmt(T[pos-1])}. Apply the rule: ${fmt(T[pos-1])} ${sg(d)} = <b>${fmt(ans)}</b>.</p><p>Check with the number after: ${fmt(ans)} ${sg(d)} = ${fmt(T[pos+1])} ✔</p>`,
      steps:[{q:`${fmt(T[j+1])} − ${sn(T[j])} = ? (the rule)`,a:N(d)},{q:`Missing = ${fmt(T[pos-1])} ${sg(d)} = ?`,a:N(ans)}]}}});
def('seqrule',{topic:'Recognizing Rules',
  gen(lv){if(lv<3)return{s:R(1,40),d:lv===1?R(2,12):pick([R(3,15),-R(2,9)]),n:0};return{s:R(1,20),d:R(2,9),n:R(8,20)}},
  build({s,d,n}){const T=arTerms(s,d,5);
    if(!n)return{q:`What number is added each time? (Type a negative if it goes down.)<div class="seq">${T.map(fmt).join(', ')}, …</div>`,a:N(d),fmt:'integer',hint:'Subtract a number from the one after it.',
      adv:`${fmt(T[1])} − ${sn(T[0])} = <b>${fmt(d)}</b>, and it is the same for every pair.`,
      det:`<p>A pattern rule tells how to get from one number to the next.</p><p>${T.slice(1).map((v,i)=>`${fmt(v)} − ${sn(T[i])} = ${fmt(d)}`).join('<br>')}</p><p>Every jump is the same: the rule is <b>${d>0?'add '+d:'add '+fmt(d)+' (go down '+(-d)+')'}</b>.</p>`,
      steps:[{q:`${fmt(T[1])} − ${sn(T[0])} = ?`,a:N(d)},{q:`${fmt(T[3])} − ${sn(T[2])} = ? (check)`,a:N(d)}]};
    const ans=s+(n-1)*d;
    return{q:`The pattern continues. What is the <b>${n}th</b> number?<div class="seq">${T.join(', ')}, …</div>`,a:N(ans),fmt:'integer',hint:'How many jumps from the 1st number to the '+n+'th?',
      adv:`Rule: +${d}. From the 1st to the ${n}th there are ${n-1} jumps. ${s} + ${n-1} × ${d} = <b>${ans}</b>.`,
      det:`<p>Instead of writing all ${n} numbers, count the <b>jumps</b>.</p><ol><li>The rule is +${d}.</li><li>From number 1 to number ${n} there are ${n} − 1 = <b>${n-1}</b> jumps (like ${n} fence posts have ${n-1} gaps).</li><li>Total climb: ${n-1} × ${d} = ${(n-1)*d}</li><li>${s} + ${(n-1)*d} = <b>${ans}</b></li></ol>`,
      steps:[{q:`The rule: ${T[1]} − ${T[0]} = ?`,a:N(d)},{q:`Jumps from the 1st to the ${n}th = ?`,a:N(n-1)},{q:`${n-1} × ${d} = ?`,a:N((n-1)*d)},{q:`${s} + ${(n-1)*d} = ?`,a:N(ans)}]}}});

// ===== VARIABLES =====
const VARS=['x','y','a','n','m','k'];
def('vsub',{topic:'Variables',
  gen(lv){const v=pick(VARS);if(lv===1){const x=R(3,15);return{f:pick(['+','-']),v,x,k:R(1,x-1)}}if(lv===2){const f=pick(['k*','/']);const k=R(2,9);return{f,v,k,x:f==='/'?k*R(2,9):R(2,12)}}return{f:pick(['sq','ksq']),v,x:R(2,9),k:R(2,5)}},
  build({f,v,x,k}){let e,ans,steps,how;
    if(f==='+'){e=`${v} + ${k}`;ans=x+k;steps=[{q:`Replace ${v} with ${x}: ${x} + ${k} = ?`,a:N(ans)}];how=`${x} + ${k}`}
    else if(f==='-'){e=`${v} − ${k}`;ans=x-k;steps=[{q:`Replace ${v} with ${x}: ${x} − ${k} = ?`,a:N(ans)}];how=`${x} − ${k}`}
    else if(f==='k*'){e=`${k}${v}`;ans=k*x;steps=[{q:`${k}${v} means ${k} × ${v}. ${k} × ${x} = ?`,a:N(ans)}];how=`${k} × ${x}`}
    else if(f==='/'){e=`${v} ÷ ${k}`;ans=x/k;steps=[{q:`${x} ÷ ${k} = ?`,a:N(ans)}];how=`${x} ÷ ${k}`}
    else if(f==='sq'){e=`${v}²`;ans=x*x;steps=[{q:`${v}² means ${v} × ${v}. ${x} × ${x} = ?`,a:N(ans)}];how=`${x} × ${x}`}
    else{e=`${k}${v}²`;ans=k*x*x;steps=[{q:`First the square: ${x} × ${x} = ?`,a:N(x*x)},{q:`Then ${k} × ${x*x} = ?`,a:N(ans)}];how=`${k} × (${x} × ${x})`}
    return{q:`If <b>${v} = ${x}</b>, find <b>${e}</b>.`,a:N(ans),fmt:'number',hint:`Put ${x} in the box where ${v} is.`,
      adv:`Substitute ${v} = ${x}: ${e} = ${how} = <b>${ans}</b>.`,
      det:`<p>A variable is a <b>box 📦 with a number inside</b>. Here, box ${v} holds the number ${x}.</p><p>Wherever you see ${v}, open the box and put ${x} there.</p><ul><li>A number touching a letter means <b>multiply</b>: 3${v} = 3 × ${v}</li><li>${v}² means ${v} × ${v} (not ${v} × 2!)</li></ul><p>${e} → ${how} = <b>${ans}</b></p>`,steps}}});
def('chest',{topic:'Variables',
  gen(lv){const v=pick(VARS);if(lv===1)return{f:'+',v,x:R(1,15),b:R(2,15)};if(lv===2)return{f:'-',v,x:R(5,25),b:R(2,15)};return{f:'*',v,x:R(2,12),b:R(2,9)}},
  build({f,v,x,b}){const c=f==='+'?x+b:f==='-'?x-b:x*b;const eqs=f==='+'?`${v} + ${b} = ${c}`:f==='-'?`${v} − ${b} = ${c}`:`${b}${v} = ${c}`;
    const undo=f==='+'?`${c} − ${b}`:f==='-'?`${c} + ${b}`:`${c} ÷ ${b}`;
    return{q:`🧰 <b>${eqs}</b><br>What number is hidden in treasure chest <b>${v}</b>?`,a:N(x),fmt:'number',hint:f==='+'?`What number plus ${b} makes ${c}?`:f==='-'?`What number minus ${b} leaves ${c}?`:`${b} times what number is ${c}?`,
      adv:`Ask: "${f==='+'?`What plus ${b} is ${c}`:f==='-'?`What minus ${b} is ${c}`:`${b} times what is ${c}`}?" Undo it: ${undo} = <b>${x}</b>.`,
      det:`<p>Instead of a box □, algebra uses a letter. ${eqs.replace(v,'□')} is the same as ${eqs}.</p><p>${f==='+'?`Something plus ${b} gives ${c}. Count back: take ${b} away from ${c}.`:f==='-'?`Something minus ${b} leaves ${c}. Put the ${b} back: add it to ${c}.`:`${b} groups of the chest make ${c}. Share ${c} into ${b} equal groups.`}</p><p>${undo} = <b>${x}</b>. Check: ${eqs.replace(f==='*'?`${b}${v}`:v,f==='*'?`${b} × ${x}`:`${x}`)} ✔</p>`,
      steps:[{q:`Undo it: ${undo} = ?`,a:N(x)},{q:`Check: put it in the chest. ${f==='*'?`${b} × ${x}`:f==='+'?`${x} + ${b}`:`${x} − ${b}`} = ?`,a:N(c)}]}}});

// ===== EXPRESSIONS =====
def('expr',{topic:'Algebraic Expressions',
  gen(lv){const v=pick(['x','y','a','n']);
    if(lv===1)return pick([{f:'ax+b',v,a:R(2,6),b:R(1,15),x:R(1,9)},{f:'ax-b',v,a:R(2,6),b:R(1,9),x:R(2,9)},{f:'like',v,a:R(2,9),b:R(2,9),c:R(1,5)}]);
    if(lv===2)return pick([{f:'a(x+b)',v,a:R(2,6),b:R(1,9),x:R(1,9)},{f:'ax+by',v:'a',a:R(2,6),b:R(2,6),x:R(1,9),y:R(1,9)},{f:'x2+b',v,a:1,b:R(1,20),x:R(2,9)}]);
    return pick([{f:'ax+b',v,a:R(2,9),b:R(-15,15)||3,x:R(-9,-1)},{f:'ax-b',v,a:R(2,9),b:R(1,12),x:R(-8,-1)},{f:'ax+by',v:'a',a:R(2,7),b:R(-6,-2),x:R(2,9),y:R(-6,6)||2},{f:'a(x+b)',v,a:R(2,5),b:R(-9,-1),x:R(-5,9)}])},
  build(P){const{f,v,a,b,x,y,c}=P;let q,ans,steps,adv,det;
    if(f==='like'){ans=a+b-c;q=`Simplify: <b>${a}${v} + ${b}${v} − ${c}${v}</b> = ?${v}<br><small>(type only the number in front of ${v})</small>`;
      steps=[{q:`${a} + ${b} = ?`,a:N(a+b)},{q:`${a+b} − ${c} = ?`,a:N(ans)}];adv=`Like terms: combine the numbers in front. ${a} + ${b} − ${c} = ${ans}, so <b>${ans}${v}</b>.`;
      det=`<p>Think of ${v} as a 🍎 mango. ${a} mangoes + ${b} mangoes − ${c} mangoes = ${ans} mangoes.</p><p>${a}${v} + ${b}${v} − ${c}${v} = (${a} + ${b} − ${c})${v} = <b>${ans}${v}</b>. Only <b>like terms</b> (same letter) can be combined.</p>`;
      return{q,a:N(ans),fmt:'integer',hint:'Add and subtract the numbers in front of the letter.',adv,det,steps}}
    const X=sn(x),Y=sn(y);
    if(f==='ax+b'){ans=a*x+b;q=`Evaluate <b>${a}${v} ${sg(b)}</b> when ${v} = ${fmt(x)}`;steps=[{q:`${a} × ${X} = ?`,a:N(a*x)},{q:`${fmt(a*x)} ${sg(b)} = ?`,a:N(ans)}];adv=`${a}(${fmt(x)}) ${sg(b)} = ${fmt(a*x)} ${sg(b)} = <b>${fmt(ans)}</b>.`}
    else if(f==='ax-b'){ans=a*x-b;q=`Evaluate <b>${a}${v} − ${b}</b> when ${v} = ${fmt(x)}`;steps=[{q:`${a} × ${X} = ?`,a:N(a*x)},{q:`${fmt(a*x)} − ${b} = ?`,a:N(ans)}];adv=`${a}(${fmt(x)}) − ${b} = ${fmt(a*x)} − ${b} = <b>${fmt(ans)}</b>.`}
    else if(f==='a(x+b)'){ans=a*(x+b);q=`Evaluate <b>${a}(${v} ${sg(b)})</b> when ${v} = ${fmt(x)}`;steps=[{q:`Inside the parentheses first: ${fmt(x)} ${sg(b)} = ?`,a:N(x+b)},{q:`${a} × ${sn(x+b)} = ?`,a:N(ans)}];adv=`Parentheses first: ${fmt(x)} ${sg(b)} = ${fmt(x+b)}. Then ${a} × ${sn(x+b)} = <b>${fmt(ans)}</b>.`}
    else if(f==='ax+by'){ans=a*x+b*y;q=`Evaluate <b>${a}a ${b<0?'− '+(-b):'+ '+b}b</b> when a = ${fmt(x)} and b = ${fmt(y)}`;steps=[{q:`${a} × ${X} = ?`,a:N(a*x)},{q:`${b} × ${Y} = ?`,a:N(b*y)},{q:`${fmt(a*x)} + ${sn(b*y)} = ?`,a:N(ans)}];adv=`${a}(${fmt(x)}) + ${b<0?`(${b})`:b}(${fmt(y)}) = ${fmt(a*x)} + ${sn(b*y)} = <b>${fmt(ans)}</b>.`}
    else{ans=x*x+b;q=`Evaluate <b>${v}² + ${b}</b> when ${v} = ${fmt(x)}`;steps=[{q:`${v}² = ${X} × ${X} = ?`,a:N(x*x)},{q:`${x*x} + ${b} = ?`,a:N(ans)}];adv=`${fmt(x)}² = ${x*x}, then + ${b} = <b>${ans}</b>.`}
    det=`<p>Evaluate = <b>replace the letter with its number, then calculate</b>.</p><ol><li>Open the box: ${f==='ax+by'?`a = ${fmt(x)}, b = ${fmt(y)}`:`${v} = ${fmt(x)}`}. Write it in parentheses to be safe: ${f==='ax+by'?`${a}(${fmt(x)}) + ${b}(${fmt(y)})`:f==='a(x+b)'?`${a}((${fmt(x)}) ${sg(b)})`:f==='x2+b'?`(${fmt(x)})² + ${b}`:`${a}(${fmt(x)}) ${f==='ax-b'?'− '+b:sg(b)}`}</li><li>Follow the order: <b>P</b>arentheses → <b>E</b>xponents → <b>M</b>ultiply/<b>D</b>ivide → <b>A</b>dd/<b>S</b>ubtract (PEMDAS)</li>${steps.map(s=>`<li>${s.q.replace('?','<b>'+specText(s.a)+'</b>')}</li>`).join('')}</ol>${x<0||(y!==undefined&&y<0)?'<p>Careful with negatives: (−) × (+) = (−), (−) × (−) = (+).</p>':''}`;
    return{q,a:N(ans),fmt:'integer',hint:'Replace the letter, then multiply before adding.',adv,det,steps}}});

// ===== ONE-STEP EQUATIONS =====
def('eq1',{topic:'One-Step Equations',
  gen(lv){const v=pick(['x','x','y','n','a']);const f=lv===1?pick(['+','-']):pick(['+','-','*','/']);let x,a;
    if(f==='*'){a=R(2,lv===3?12:9);x=lv===3?R(-9,12)||4:R(2,12)}else if(f==='/'){a=R(2,9);x=a*(lv===3?(R(-9,12)||3):R(2,10))}else{a=R(2,lv===1?15:30);x=lv===3?R(-15,25):R(1,lv===1?15:40)}
    return{f,v,x,a}},
  build({f,v,x,a}){const b=f==='+'?x+a:f==='-'?x-a:f==='*'?a*x:x/a;
    const L=f==='+'?`${v} + ${a}`:f==='-'?`${v} − ${a}`:f==='*'?`${a}${v}`:`${v}/${a}`;
    const opn={'+':['added to','Subtract',`${fmt(b)} − ${a}`],'-':['subtracted from','Add',`${fmt(b)} + ${a}`],'*':['multiplied by','Divide',`${fmt(b)} ÷ ${a}`],'/':['divided by','Multiply',`${fmt(b)} × ${a}`]}[f];
    return{q:`Solve: <b>${L} = ${fmt(b)}</b>`,a:N(x),fmt:'integer',hint:`Do the opposite operation to both sides.`,
      adv:`${v} is ${opn[0]} ${a}. ${opn[1]} ${a} on both sides: ${v} = ${opn[2]} = <b>${fmt(x)}</b>.`,
      det:`${scale(L,fmt(b))}<p>The scale is balanced: the left side equals the right side. We want ${v} <b>alone</b> on one side.</p><p><b>Golden Rule: whatever you do to one side, do to the other side.</b></p><ol><li>Right now ${v} is <b>${opn[0]} ${a}</b>.</li><li>The opposite is: <b>${opn[1].toLowerCase()} ${a}</b>.</li><li>Do it to both sides: ${f==='+'?`${v} + ${a} − ${a} = ${fmt(b)} − ${a}`:f==='-'?`${v} − ${a} + ${a} = ${fmt(b)} + ${a}`:f==='*'?`${a}${v} ÷ ${a} = ${fmt(b)} ÷ ${a}`:`${v}/${a} × ${a} = ${fmt(b)} × ${a}`}</li><li>${v} = <b>${fmt(x)}</b></li></ol><p>Check: put ${fmt(x)} back in: ${L.replace(v,sn(x)).replace(`${a}${sn(x)}`,`${a} × ${sn(x)}`)} = ${fmt(b)} ✔</p>`,
      steps:[{q:`What number is ${v} ${opn[0]}?`,a:N(a)},{q:`${opn[1]} ${a} on both sides: ${opn[2]} = ?`,a:N(x)}]}}});

def('eq2',{topic:'Multi-Step Equations',
  gen(lv){const v=pick(['x','x','y','n']);const x=lv===3?(R(-8,12)||2):R(1,12);
    if(lv===1)return{f:pick(['ax+b','ax-b']),v,x,a:R(2,6),b:R(1,15)};
    if(lv===2)return pick([{f:'ax+b',v,x,a:R(3,9),b:R(2,25)},{f:'x/a+b',v,x:R(1,8)*0+0,a:R(2,6),b:R(1,12),m:R(1,10)},{f:'a(x+b)',v,x,a:R(2,6),b:R(1,9)}]);
    return pick([{f:'ax-b',v,x,a:R(3,9),b:R(2,20)},{f:'a(x+b)',v,x,a:R(2,6),b:R(-5,9)||2},{f:'both',v,x,a:R(4,9),c:R(1,3),b:R(-10,10),}])},
  build(P){let{f,v,x,a,b,c,m}=P;if(f==='x/a+b')x=a*m;let L,rhs,steps,adv,undo;
    if(f==='ax+b'){rhs=a*x+b;L=`${a}${v} + ${b}`;steps=[{q:`Undo "+ ${b}": ${fmt(rhs)} − ${b} = ?`,a:N(a*x)},{q:`Now ${a}${v} = ${fmt(a*x)}. Divide: ${fmt(a*x)} ÷ ${a} = ?`,a:N(x)}];undo=[`Subtract ${b} from both sides → ${a}${v} = ${fmt(a*x)}`,`Divide both sides by ${a} → ${v} = ${fmt(x)}`]}
    else if(f==='ax-b'){rhs=a*x-b;L=`${a}${v} − ${b}`;steps=[{q:`Undo "− ${b}": ${fmt(rhs)} + ${b} = ?`,a:N(a*x)},{q:`Now ${a}${v} = ${fmt(a*x)}. Divide: ${fmt(a*x)} ÷ ${a} = ?`,a:N(x)}];undo=[`Add ${b} to both sides → ${a}${v} = ${fmt(a*x)}`,`Divide both sides by ${a} → ${v} = ${fmt(x)}`]}
    else if(f==='x/a+b'){rhs=x/a+b;L=`${v}/${a} + ${b}`;steps=[{q:`Undo "+ ${b}": ${fmt(rhs)} − ${b} = ?`,a:N(x/a)},{q:`Now ${v}/${a} = ${fmt(x/a)}. Multiply: ${fmt(x/a)} × ${a} = ?`,a:N(x)}];undo=[`Subtract ${b} from both sides → ${v}/${a} = ${fmt(x/a)}`,`Multiply both sides by ${a} → ${v} = ${fmt(x)}`]}
    else if(f==='a(x+b)'){rhs=a*(x+b);L=`${a}(${v} ${sg(b)})`;steps=[{q:`Divide both sides by ${a}: ${fmt(rhs)} ÷ ${a} = ?`,a:N(x+b)},{q:`Now ${v} ${sg(b)} = ${fmt(x+b)}. Undo it: ${v} = ?`,a:N(x)}];undo=[`Divide both sides by ${a} → ${v} ${sg(b)} = ${fmt(x+b)}`,`${b>0?'Subtract':'Add'} ${Math.abs(b)} on both sides → ${v} = ${fmt(x)}`]}
    else{const d=a*x+b-c*x;rhs=`${c===1?'':c}${v} ${sg(d)}`;L=`${a}${v} ${sg(b)}`;
      steps=[{q:`Move the ${v}'s: subtract ${c===1?'':c}${v} from both sides. ${a} − ${c} = ? (${v}'s left)`,a:N(a-c)},{q:`Move the numbers: ${fmt(d)} − ${sn(b)} = ?`,a:N(d-b)},{q:`${a-c}${v} = ${fmt(d-b)}, so ${v} = ?`,a:N(x)}];
      undo=[`Subtract ${c===1?'':c}${v} from both sides → ${a-c}${v} ${sg(b)} = ${fmt(d)}`,`${b>=0?'Subtract '+b:'Add '+(-b)} on both sides → ${a-c}${v} = ${fmt(d-b)}`,`Divide by ${a-c} → ${v} = ${fmt(x)}`];
      return{q:`Solve: <b>${L} = ${rhs}</b>`,a:N(x),fmt:'integer',hint:`Get all the ${v}'s on one side first.`,adv:undo.join('. ')+'.',
        det:`${scale(L,rhs)}<p>There are ${v}'s on both sides of the scale. Treat ${v} like bags of rice of the same weight.</p><ol>${undo.map(u=>`<li>${u}</li>`).join('')}</ol><p>Check: left = ${a}(${fmt(x)}) ${sg(b)} = ${fmt(a*x+b)}, right = ${c}(${fmt(x)}) ${sg(d)} = ${fmt(c*x+d)} ✔ Balanced!</p>`,steps}}
    return{q:`Solve: <b>${L} = ${fmt(rhs)}</b>`,a:N(x),fmt:'integer',hint:'Undo adding/subtracting first, then multiplying/dividing.',
      adv:undo.join('. ')+'. Answer: <b>'+v+' = '+fmt(x)+'</b>.',
      det:`${scale(L,fmt(rhs))}<p>Think of ${v} as a gift that was wrapped in layers. To unwrap it, remove the <b>last layer first</b>.</p><p>The Golden Rule still works: <b>whatever you do to one side, do to the other</b>.</p><ol>${undo.map(u=>`<li>${u}</li>`).join('')}</ol><p>Check: ${L.replace(v,`(${fmt(x)})`)} = ${fmt(rhs)} ✔</p>`,steps}}});

function lvFor(i,n,mode){if(mode==='hard')return R(2,3);if(mode==='mix')return R(1,3);return Math.min(3,1+Math.floor(3*i/n))}
function buildSet(spec,mode,seen){
  seen=seen||new Set();const out=[];
  for(const{g,n}of spec){let made=0,tries=0;while(made<n&&tries<n*60){tries++;const lv=lvFor(made,n,mode);const p=G[g].gen(lv);const k=g+JSON.stringify(p);if(seen.has(k))continue;
      let q;try{q=G[g].build(p,lv)}catch(e){continue}if(!q||q.a===undefined||(q.a.t!=='ratio'&&q.a.t!=='frac'&&!isFinite(q.a.v)))continue;
      seen.add(k);out.push({g,p,lv});made++}}
  if(spec.length>1){const sorted=out.map(o=>[o.lv+Math.random()*1.6,o]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);return sorted}
  return out;
}

  lesson:`<p>A <b>pattern</b> follows a rule. Be a detective: look at how each number changes to the next.</p><p>3, 7, 11, 15, … → each jump is +4, so next is <b>19</b>.</p><p>Some patterns multiply (2, 4, 8, 16 → ×2), some go down (50, 45, 40 → −5).</p>`},
 {id:'t8',w:2,name:'Variable Valley',e:'🗝️',boss:'The Mystery Wizard',be:'🧙',mi:'👻',mn:'Mystery Ghosts',x:670,y:150,bg:'linear-gradient(#e3d1ff,#f3eaff 62%,#7d5ba6 62%)',

  lm:{k:'wizard',name:'Wizard Academy',e:'🔮',desc:'+10% XP from every answer'},
  lesson:`<p><b>Variables explained simply:</b> think of a variable as a <b>box with an unknown number inside</b>.</p><p>Instead of writing □ + 5 = 12, algebra uses a letter: <b>x + 5 = 12</b>. The variable x represents the unknown number. Since 7 + 5 = 12, then <b>x = 7</b>.</p><ul><li>x = 10 means the value of x is 10.</li><li>If x = 4, then 2x = 2 × 4 = 8 (a number touching a letter means multiply).</li><li>a² means a × a. If a = 4, a² = 16.</li></ul><p><b>The most important algebra idea:</b> algebra is simply finding the missing number. For x + 8 = 13, ask yourself: "What number plus 8 equals 13?" → 5.</p>`},
 {id:'t9',w:2,name:'Empire of Expressions',e:'🏯',boss:'Empress Expressia',be:'👸',mi:'🐍',mn:'Expression Serpents',x:500,y:220,bg:'linear-gradient(#ffd9e8,#fff0f6 62%,#c06c8f 62%)',

 {id:'t10',w:2,name:'Fortress of Equations',e:'🏰',boss:'The Iron Golem',be:'🗿',mi:'💀',mn:'Skeleton Guards',x:340,y:140,bg:'linear-gradient(#d6dbe6,#eef1f6 62%,#7f8796 62%)',

 {id:'t11',w:2,name:'Castle of Balance',e:'⚖️',boss:'The Balance Knight',be:'🛡️',mi:'🦅',mn:'Griffin Riders',x:180,y:220,bg:'linear-gradient(#c9e4ff,#eaf4ff 62%,#5b7fa6 62%)',

 {id:'t12',w:2,name:'Kingdom of Real Problems',e:'🏘️',boss:'The Bandit King',be:'🥷',mi:'🐗',mn:'Bandit Boars',x:120,y:90,bg:'linear-gradient(#fff1b8,#fffbe6 62%,#b58a3c 62%)',

function refreshTop(keys){const t=$('#topbar');if(!t)return;const tmp=document.createElement('div');tmp.innerHTML=topbar();t.replaceWith(tmp.firstChild);(keys||[]).forEach(k=>{const e=$('#r-'+k);if(e){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}})}

function mountAsk(el,{spec,fmt,onDone,label}){
  const keys=[['7'],['8'],['9'],['/','op'],['⌫','del'],['4'],['5'],['6'],[':','op'],['C','del'],['1'],['2'],['3'],['%','op'],['␣','op'],['−','op'],['0'],['.','op']];
  el.innerHTML=`<div class="ask"><div class="ansrow"><input class="ans" inputmode="${fmt==='text'?'text':'none'}" autocomplete="off" spellcheck="false" placeholder="${FMT_HINT[fmt]||'answer'}"><button class="btn fire">${label||'⚔️ Attack!'}</button></div><div class="pad">${keys.map(([k,c])=>`<button class="${c||''}" data-k="${k}">${k}</button>`).join('')}<button class="btn green" data-k="go" style="grid-column:span 2;font-size:16px">✔ Enter</button></div><div class="fb"></div></div>`;
  const inp=el.querySelector('.ans'),fb=el.querySelector('.fb');
  const A={el,inp,dead:false,
    put(k){if(A.dead)return;if(k==='⌫')inp.value=inp.value.slice(0,-1);else if(k==='C')inp.value='';else if(k==='␣')inp.value+=' ';else if(k==='−')inp.value+='-';else inp.value+=k},
    msg(t,c){fb.className='fb '+(c||'');fb.innerHTML=t},
    submit(){if(A.dead)return;const v=inp.value.trim();if(!v){inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');return}
      const r=checkAns(spec,v);if(r.res==='invalid'){A.msg('Hmm, I can\'t read that. Try '+(FMT_HINT[fmt]||'a number')+'.','warn');inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');return}
      if(r.res==='almost'){A.msg('🧐 '+r.msg,'warn');return}
      onDone(r,v,A)},
    clear(){inp.value=''}};
  el.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='go')A.submit();else A.put(k)});
  el.querySelector('.fire').onclick=()=>A.submit();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();A.submit()}});
  ASK=A;if(!('ontouchstart' in window))setTimeout(()=>inp.focus(),30);
  return A;
}
document.addEventListener('keydown',e=>{if(!ASK||ASK.dead||document.activeElement===ASK.inp)return;if(e.target&&e.target.tagName==='INPUT')return;
  if(/^[0-9./:%\- ]$/.test(e.key)){ASK.put(e.key===' '?'␣':e.key==='-'?'−':e.key);e.preventDefault()}else if(e.key==='Backspace'){ASK.put('⌫');e.preventDefault()}else if(e.key==='Enter'){ASK.submit();e.preventDefault()}});
