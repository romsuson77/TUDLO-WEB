  runBattle({mode:'terr',seen:f.seen||(f.seen=[]),title:`${t.name} — ${t.fronts[fi].name.split(':')[0]}`,icon:t.e,bg:t.bg,enemy:isLast?{e:t.be,n:t.boss,boss:true}:{e:t.mi,n:t.mn,squad:true},items,total:n,offset:f.i,
    fast:null,
    reward(q,m){const g=Math.round((4+2*q.lv)*m*(1+(hasLm('bazaar')?.1:0)+(hasLm('treasury')?.25:0)));return{gold:g,food:2,wood:2,stone:1,xp:Math.round((8+4*q.lv)*(hasLm('wizard')?1.1:1)),soldiers:1+(hasLm('war')?1:0)}},
    onOrig(first){f.i++;if(first)f.first++},
    onEnd(B){P.sinceRaid++;if(hasLm('mage'))gain({crystal:2});
      if(st.fronts.every(x=>x.i>=x.items.length)&&!st._finishing){const tot=st.fronts.reduce((a,x)=>a+x.items.length,0),fst=st.fronts.reduce((a,x)=>a+x.first,0);const m=Math.round(fst/tot*100);const s=m>=90?3:m>=80?2:1;
        const first=!st.conquered;st.conquered=true;st.best=Math.max(st.best,m);st.stars=Math.max(st.stars||0,s);st.runs=(st.runs||0)+1;const msgs=[];
        if(!P.lm[t.lm.k]){P.lm[t.lm.k]=1;P._new=t.lm.k;msgs.push(`${t.lm.e} <b>${t.lm.name}</b> built! <small>${t.lm.desc}</small>`)}
        if(t.id==='t1'&&!P.bld.lumber){P.bld.lumber=1;msgs.push(`🪵 <b>Lumber Mill</b> built!`)}
        if(t.hero&&unlockHero(t.hero))msgs.push(`${HEROES[t.hero].e} Hero unlocked: <b>${HEROES[t.hero].name}</b> — ${HEROES[t.hero].skill}`);
        gain({gold:100+t.i*30,crystal:5,xp:100});save();
        return{done:true,conquest:true,title:t.final?'🏆 GRAND MASTER OF NUMERIA!':`🚩 ${t.name} CONQUERED!`,
          body:`<div style="font-size:70px" class="castleArt">${t.final?'👑':'🚩'}</div>${t.final?`<p style="font-size:20px">The Emperor of Confusion is defeated! The curse is broken.<br><b>${esc(P.name)}</b>, you are the <b>Grand Master of Numeria</b>!</p>`:''}<p style="font-size:20px">Mastery: <b>${m}%</b> <span class="stars" style="font-size:28px">${stars(s)}</span>${m<st.best?` (best ${st.best}%)`:''}</p>${first?msgs.map(x=>`<p style="font-size:17px">${x}</p>`).join(''):''}${first&&t.i<12&&!TERR[t.i+1].final?`<p>New territory unlocked: ${TERR[t.i+1].e} <b>${TERR[t.i+1].name}</b></p>`:''}${m<80?'<p class="muted">Tip: 80% mastery is needed for the final empire. You can reconquer later with new questions.</p>':''}`,btn:`go('map')`}}
      return null}})}

// ---------- RAIDS & REVIEW ----------
function weakGens(){const conqG=new Set();conquered().forEach(t=>t.fronts.forEach(f=>f.spec.forEach(s=>conqG.add(s.g))));
  const arr=[...conqG].map(g=>{const s=P.stats[G[g].topic]||{n:0,first:0};return{g,score:s.n?s.first/s.n:1,n:s.n}}).sort((a,b)=>a.score-b.score);return arr}
function raidEnemy(){const c=conquered().length;return c>=9?{n:'A Dragon',e:'🐉'}:c>=5?{n:'An Orc invasion',e:'👹'}:{n:'A Goblin raid',e:'👺'}}
function mixFromWeak(n){const w=weakGens();if(!w.length)return[];const top=w.slice(0,Math.max(2,Math.ceil(w.length/3)));const spec=[];for(let i=0;i<n;i++){const g=(i%3===2?pick(w):pick(top)).g;const s=spec.find(x=>x.g===g);if(s)s.n++;else spec.push({g,n:1})}return shuffle(buildSet(spec,'mix'))}
function startRaid(){const E=raidEnemy();const items=mixFromWeak(5);let ok=0;
  runBattle({mode:'raid',title:'Defend the Village!',icon:'🛡️',bg:'linear-gradient(#ffb199,#ffd8c9 62%,#7a4a2a 62%)',enemy:{e:E.e,n:E.n,boss:true},items,total:5,offset:0,
    reward(){return{xp:6}},onOrig(f){if(f)ok++},penalty(){const k=hasLm('scouts')?.5:1;return{gold:-Math.round(10*k),food:-Math.round(5*k)}},
    onEnd(){P.sinceRaid=0;P.raids++;const win=ok>=3;if(win)gain({gold:40+ok*10,stone:10,wood:10,crystal:2});save();
      return{done:true,title:win?'🛡️ Village defended!':'😓 The raiders stole some supplies',body:`<p style="font-size:20px">${ok}/5 attacks blocked.</p>${win?'<p>Reward: gold, stone, wood and 2 crystals!</p>':'<p>Your village is safe, but they took some gold and food. Your weakest topics were chosen for this defense — practise them in the Review Army!</p>'}`,btn:`go('kingdom')`}}})}
function startReview(){if(!campGate())return;const items=mixFromWeak(10);let ok=0;
  runBattle({mode:'review',title:'Review Army — your personal training',icon:'🔁',bg:'linear-gradient(#c8f0e0,#e8fff5 62%,#3f9f7f 62%)',enemy:{e:'🧟',n:'Shadow of Forgetting',squad:true},items,total:10,offset:0,
    reward(q,m){return{crystal:1,xp:8,gold:3*m}},onOrig(f){if(f)ok++},
    onEnd(){P.reviewDone=true;save();return{done:true,title:'🔁 Review complete!',body:`<p style="font-size:20px">${ok}/10 first-try correct.</p><p>The Review Army picks questions from your <b>weakest topics</b>, so every review makes you stronger where you need it most.</p>`,btn:`go('map')`}}})}

// ---------- BATTLE ENGINE ----------
let B=null;
function runBattle(cfg){
  B={cfg,queue:cfg.items.map(it=>({it,ret:false})),pos:0,hp:cfg.items.length,maxhp:cfg.items.length,combo:1,earned:{},firstOk:0,origDone:0,hints:heroOn('fractiona')?99:hasLm('library')?3:0,secondChance:!!heroOn('algebrax'),answered:0};
  if(!B.queue.length){toast('No questions available yet.');go('kingdom');return}
  const army=()=>{const a=P.army;let s='';const add=(e,n)=>{for(let i=0;i<n;i++)s+=`<span>${e}</span>`};add('🗡️',Math.min(6,Math.ceil(a.soldiers/5)));add('🏹',Math.min(4,Math.ceil(a.archers/10)));add('⚔️',Math.min(4,Math.ceil(a.swordsmen/10)));add('🐎',Math.min(3,Math.ceil(a.cavalry/6)));add('👑',Math.min(2,a.champions));if(P.hero&&P.heroes[P.hero])s=`<span style="font-size:1.4em">${HEROES[P.hero].e}</span>`+s;return s||'<span>🗡️</span>'};
  const E=cfg.enemy;
  screen(`${topbar()}<div class="bhead"><span class="t">${cfg.icon} ${esc(cfg.title)}</span><span class="pill" id="bprog"></span><span class="pill" id="bstreak">🔥 ${P.streak.cur}</span><span class="pill" id="bcombo" style="display:none"></span><button class="btn sec sm" onclick="quitBattle()">🏳️ Retreat</button></div>
   <div class="arena" id="arena" style="background:${cfg.bg}"><div class="ground"></div><div class="army" id="army">${army()}</div>
    <div class="enemy ${E.boss?'boss':''}" id="enemy"><div class="em">${E.squad?E.e+'<span style="font-size:.6em">'+E.e+E.e+'</span>':E.e}</div><div class="nm">${esc(E.n)}</div><div class="hp"><i id="hpbar" style="width:100%"></i></div></div></div>
   <div class="qcard"><div class="qtext" id="qtext"></div><div id="askbox"></div><div class="tools" id="tools"></div></div>`);
  nextQ();
}
function bprog(){const c=B.cfg;$('#bprog').textContent=`${Math.min(c.offset+B.origDone+1,c.total)} / ${c.total}`}
function nextQ(){
  if(B.pos>=B.queue.length){return endBattle()}
  const cur=B.queue[B.pos];resolveItem(cur.it);cur.q=cur.q||makeQ(cur.it.g,cur.it.p,cur.it.lv);cur.tries=0;cur.guided=false;cur.t0=Date.now();B.cur=cur;bprog();
  const mode=scaffoldMode(cur.it.g,B.cfg);cur.mode=mode;
  $('#tools').innerHTML=B.hints>0?`<button class="btn sec sm" onclick="useHint()">💡 Hint ${B.hints>50?'(∞)':'('+B.hints+')'}</button>`:'';
  if(mode==='guided')return guidedQ(cur);
  if(mode==='warmup'&&!cur.ret)return warmupQ(cur);
  mountMain(cur);
}
function mountMain(cur,pre){
  $('#qtext').innerHTML=(pre||'')+(cur.ret?'<div class="retban">🔁 The question returns! Show what you learned.</div><br>':'')+cur.q.q;
  mountAsk($('#askbox'),{spec:cur.q.a,fmt:cur.q.fmt,onDone:onAnswer});
}
function useHint(){if(B.hints<=0||!B.cur)return;B.hints--;ASK.msg('💡 '+B.cur.q.hint,'warn');$('#tools').innerHTML=B.hints>0?`<button class="btn sec sm" onclick="useHint()">💡 Hint ${B.hints>50?'(∞)':'('+B.hints+')'}</button>`:''}
function stat(q){const k=q.topic;P.stats[k]=P.stats[k]||{n:0,first:0,wrong:0,time:0,rescues:0,help:0};return P.stats[k]}
function trackFact(q,ok){if(q.g!=='mul')return;const{a,b}=q.p;if(a>12||b>12)return;const k=Math.min(a,b)+'x'+Math.max(a,b);const f=P.facts[k]=P.facts[k]||{c:0,w:0};if(ok)f.c++;else f.w++}
function fx(cls,el){el=el||$('#enemy');if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function popAt(txt,x,y,color){const a=$('#arena');if(!a)return;const d=document.createElement('div');d.className='pop';d.style.left=x;d.style.top=y;if(color)d.style.color=color;d.innerHTML=txt;a.appendChild(d);setTimeout(()=>d.remove(),1200)}
function onAnswer(r,val,A){const cur=B.cur,q=cur.q,dt=(Date.now()-cur.t0)/1000;
  P.time+=Math.min(dt,120);day().t+=Math.min(dt,120);
  if(r.res==='ok'){A.dead=true;const first=cur.tries===0&&!cur.ret&&!cur.guided;const st=stat(q);
    if(!cur.ret&&!cur.counted){st.n++;cur.counted=true;if(first)st.first++;st.time+=dt;day().q++;if(first)day().ok++;P.answered++}
    trackFact(q,first&&dt<12);
    const fastLim=(B.cfg.fast||({word:35,eq2:30,mission:30,rword:30,fadd:28,expr:25}[q.g]||20))+(heroOn('decimalius')?6:0);
    const fast=dt<=fastLim&&cur.tries===0&&!cur.guided;updateSkill(q.g,cur.guided?.15:first?(fast?.3:.2):.05);
    B.combo=fast?Math.min(3,B.combo+.5):1;const mult=(cur.tries||cur.guided)?.5:Math.floor(B.combo*2)/2;
    const o=B.cfg.reward(q,mult);if(heroOn('masterius')){o.xp=(o.xp||0)*2;o.crystal=(o.crystal||0)+1}if(fast&&hasLm('trade'))o.crystal=(o.crystal||0)+1;
    const keys=gain(o);for(const k in o)B.earned[k]=(B.earned[k]||0)+o[k];
    // streak
    if(cur.tries===0){P.streak.cur++;P.streak.best=Math.max(P.streak.best,P.streak.cur);const s=STREAKS.find(x=>x[0]===P.streak.cur);if(s){banner(s[1]);SFX.streak();heroXP(10);
      if(P.streak.cur===5){gain({archers:5});if(hasLm('research'))gain({crystal:1})}if(P.streak.cur===10)gain({cavalry:3});if(P.streak.cur===20)gain({champions:1});if(P.streak.cur===50)gain({crystal:25})}
      else if(P.streak.cur>50&&P.streak.cur%25===0){banner('🌟 Legendary x'+P.streak.cur);gain({crystal:10})}}
    heroXP(2);
    if(first)B.firstOk++;
    // animation
    const proj=document.createElement('div');proj.className='proj';proj.textContent=fast?'🔥':pick(['🏹','🗡️','⚔️','🪓']);$('#arena').appendChild(proj);setTimeout(()=>proj.remove(),500);
    setTimeout(()=>{fx('hit');SFX.hit();B.hp--;$('#hpbar').style.width=Math.max(0,B.hp/B.maxhp*100)+'%';popAt(first?(fast?'⚡ CRITICAL!':'💥 HIT!'):'✔ HIT',`${60+Math.random()*15}%`,'20%');
      popAt(`+${o.gold||o.crystal||o.archers||o.engineers||o.swordsmen||''}${o.gold?'🪙':o.crystal?'💎':o.archers?'🏹':o.engineers?'🛠️':o.swordsmen?'⚔️':''}`,'45%','50%','#ffd25e');refreshTop(keys)},380);
    $('#bstreak').textContent='🔥 '+P.streak.cur;const bc=$('#bcombo');if(B.combo>1){bc.style.display='';bc.textContent='⚡ Combo x'+(Math.floor(B.combo*2)/2)}else bc.style.display='none';
    A.msg(r.note?'✅ '+r.note:cur.guided?'✅ You solved it step by step! Each guided win makes you stronger.':first?pick(['✅ Excellent!','✅ Perfect strike!','✅ Brilliant, Commander!','✅ Correct!','✅ Well done!']):'✅ Yes! You got it!','good');
    if(!cur.ret){B.origDone++;B.cfg.onOrig(first)}
    B.answered++;save();
    setTimeout(()=>{B.pos++;nextQ()},first?850:1100);return}
  // wrong
  SFX.miss();fx('lunge');setTimeout(()=>fx('hurt',$('#army')),200);P.streak.cur=0;$('#bstreak').textContent='🔥 0';B.combo=1;$('#bcombo').style.display='none';
  trackFact(q,false);updateSkill(q.g,cur.tries===0?-.35:-.15);
  if(B.cfg.penalty)gain(B.cfg.penalty());
  else if(B.secondChance){B.secondChance=false;popAt('🛡️ Second Chance!','20%','20%')}
  else{const loss=Math.min(P.army.soldiers,2);if(loss){P.army.soldiers-=loss;popAt(`−${loss}🗡️`,'15%','30%','#ff8a80')}}
  refreshTop(['power']);
  if(!cur.ret&&!cur.counted){const st=stat(q);st.wrong++}
  if(cur.tries===0){cur.tries=1;A.clear();A.msg(`🤔 Not yet! Can you solve it another way?<br><small style="font-weight:600">💡 ${q.hint}</small>`,'warn');return}
  A.dead=true;
  if(!cur.ret&&!cur.counted){const st=stat(q);st.n++;cur.counted=true;st.time+=dt;day().q++;P.answered++}
  stat(q).rescues++;save();
  rescue(q,val,(res)=>{ // after rescue
    if(!cur.ret){B.origDone++;B.cfg.onOrig(false);B.queue.push({it:cur.it,ret:true,q:null})}
    else{B.hp--;}
    if(!cur.ret){}else{$('#hpbar').style.width=Math.max(0,B.hp/B.maxhp*100)+'%'}
    save();B.pos++;nextQ()});
}
function banner(t){const a=$('#arena');if(!a)return;const d=document.createElement('div');d.className='streakban';d.textContent=t;a.appendChild(d);setTimeout(()=>d.remove(),1900)}
function quitBattle(){if(!B||!B.cfg)return;modal(`<div class="center"><div style="font-size:54px">🏳️</div><h2>Retreat?</h2><p>Your progress is saved after every answer. You can continue this battle later.</p><button class="btn" onclick="closeModal()">⚔️ Keep fighting</button> <button class="btn sec" onclick="B=null;go('${B.cfg.mode==='terr'?'map':B.cfg.mode==='raid'?'kingdom':B.cfg.mode==='review'?'map':B.cfg.mode==='practice'?'plan':'camp'}')">Retreat</button></div>`)}
function endBattle(){const res=B.cfg.onEnd(B);const e=B.earned;const won=res&&res.done;
  fx('dead');SFX.win();
  const earnedTxt=Object.entries(e).filter(([k,v])=>v>0).map(([k,v])=>`${{gold:'🪙',food:'🌾',wood:'🪵',stone:'🪨',crystal:'💎',xp:'⭐ XP',soldiers:'🗡️',archers:'🏹',swordsmen:'⚔️',cavalry:'🐎',engineers:'🛠️'}[k]||k} +${Math.round(v)}`).join(' &nbsp; ');
  setTimeout(()=>{if(res&&res.conquest)confetti(70);else confetti(25);
    const body=res?res.body:`<p style="font-size:20px">Enemy squad defeated! First-try: <b>${B.firstOk}/${B.cfg.items.length}</b></p>`;
    const next=res?res.btn:(B.cfg.mode==='terr'?`go('terr','${Object.keys(TBY).find(k=>B.cfg.title.startsWith(TBY[k].name))}')`:`go('kingdom')`);
    modal(`<div class="center"><h2>${res?res.title:'⚔️ Victory!'}</h2>${body}<div class="reveal"><b>Spoils of battle:</b><br>${earnedTxt||'—'}</div><button class="btn" onclick="${next}">Continue ▶</button></div>`);save()},700)}

// ---------- ADAPTIVE RESCUE ----------
function rescue(q,val,done){
  const R={q,val,stage:'adv',loop:0,cur:null};
  const STAGES=[['adv','⚡ Explain'],['sib','⚔️ Retry'],['det','🐢 Detailed'],['check','✅ Check'],['micro','🧩 Micro-lesson'],['quiz','📝 Mini quiz'],['win','🎖️ Mastered']];
  const order=STAGES.map(s=>s[0]);
  const head=(t,ic)=>`<div class="rhead"><span class="ic">${ic||'🛡️'}</span><div><h2 style="margin:0">${t}</h2><small class="muted">Learning Rescue · ${q.topic}</small></div></div><div class="stage">${STAGES.map(([k,n])=>`<span class="${k===R.stage?'on':order.indexOf(k)<order.indexOf(R.stage)?'done':''}">${n}</span>`).join('')}</div>`;
  const tabs=(qq,which)=>`<div class="tabs"><button class="${which==='adv'?'on':''}" onclick="RX.tab('adv')">⚡ Quick explanation</button><button class="${which==='det'?'on':''}" onclick="RX.tab('det')">🐢 Step-by-step explanation</button></div><div class="tabc" id="rtab">${which==='adv'?qq.adv:qq.det}</div>`;
  const RXo={tab(w){const qq=R.cur||q;$('#rtab').innerHTML=w==='adv'?qq.adv:qq.det;document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(w==='adv')))}};window.RX=RXo;
  function showAdv(){R.stage='adv';R.cur=q;modal(`${head('Let\'s figure it out together')}<div class="reveal"><div class="q">${q.q}</div><div style="margin-top:6px">Your answer: <b style="color:#d64541">${esc(val)}</b> · Correct answer: <b style="color:#2e9d5b">${specText(q.a)}</b></div></div>${tabs(q,'adv')}<div class="center" style="margin-top:12px"><button class="btn" id="rgo">⚔️ Try a similar challenge</button></div>`);$('#rgo').onclick=showSib}
  function askIn(el,qq,cb,label){return mountAsk(el,{spec:qq.a,fmt:qq.fmt,onDone:cb,label:label||'Answer'})}
  function showSib(){R.stage='sib';const s=sibling(q);R.cur=s;modal(`${head('Your turn — a similar challenge','⚔️')}<p class="muted" style="margin:0">Use the same method you just learned.</p><div class="qtext">${s.q}</div><div id="rask"></div>`);
    askIn($('#rask'),s,(r,v,A)=>{A.dead=true;if(r.res==='ok'){SFX.hit();win('You did it on the very next try!')}else{SFX.miss();showDet(s,v)}})}
  function showDet(s,v){R.stage='det';R.cur=s;modal(`${head('Slow down — step by step','🐢')}<div class="reveal"><div class="q">${s.q}</div><div style="margin-top:6px">Your answer: <b style="color:#d64541">${esc(v)}</b> · Correct answer: <b style="color:#2e9d5b">${specText(s.a)}</b></div></div>${tabs(s,'det')}<div class="center" style="margin-top:12px"><button class="btn" id="rgo">✅ Understanding Check (3 questions)</button></div>`);$('#rgo').onclick=()=>check()}
  function seriesRun(levels,title,ic,intro,onFinish,stopOnWrong){let i=0,score=0;const marks=levels.map(()=>'');
    const step=()=>{if(i>=levels.length)return onFinish(score);const s=sibling(q,levels[i]);R.cur=s;
      modal(`${head(title,ic)}<p class="muted" style="margin:0">${intro}</p><div class="dots">${marks.map((m,j)=>`<i class="${m||(j===i?'cur':'')}"></i>`).join('')}</div><div class="qtext">${s.q}</div><div id="rask"></div><div id="rfb"></div>`);
      askIn($('#rask'),s,(r,v,A)=>{A.dead=true;if(r.res==='ok'){score++;marks[i]='ok';SFX.hit();A.msg('✅ Correct!','good');i++;setTimeout(step,700)}
        else{marks[i]='no';SFX.miss();if(stopOnWrong){setTimeout(()=>stopOnWrong(s,v),500);A.msg('Not quite — let\'s break it into tiny steps.','bad');return}
          $('#rfb').innerHTML=`<div class="reveal">The answer was <b>${specText(s.a)}</b>. ${s.adv}</div><div class="center"><button class="btn sm" id="rnx">Next ▶</button></div>`;$('#rnx').onclick=()=>{i++;step()}}})};step()}
  function check(){R.stage='check';const lv=q.lv||2;seriesRun([1,Math.max(1,lv-1),lv],'Understanding Check','✅','Answer 3 questions in a row — easy to harder.',()=>win('Understanding confirmed!'),(s,v)=>micro(s))}
  function micro(s){R.stage='micro';R.cur=s;let i=0;const steps=s.steps;const doneSteps=[];
    const draw=()=>{modal(`${head('Breakdown Mode — one tiny step at a time','🧩')}<div class="reveal"><div class="q">${s.q}</div></div>${R.loop?`<div class="tabs"><button class="on">🐢 Step-by-step explanation</button></div><div class="tabc">${s.det}</div>`:''}<div class="steplist">${steps.map((st,j)=>`<div class="st ${j<i?'done':j===i?'cur':''}">${j<i?'✅':j===i?'👉':'⬜'} Step ${j+1}: ${j<=i?st.q+(j<i?' → <b>'+specText(st.a)+'</b>':''):'…'}</div>`).join('')}</div>${i<steps.length?`<div id="rask"></div>`:`<div class="center" style="margin-top:12px"><p style="font-size:18px">🎉 You solved it: <b>${specText(s.a)}</b></p><button class="btn" id="rgo">📝 Mini Quiz (5 questions)</button></div>`}`);
      if(i<steps.length){const st=steps[i];let helped=false;mountAsk($('#rask'),{spec:st.a,fmt:st.a.t==='frac'?'fraction':st.a.t==='ratio'?'ratio':st.a.t==='pct'?'percent':'integer',label:'Next step',onDone:(r,v,A)=>{
          if(r.res==='ok'){SFX.coin();i++;setTimeout(draw,helped?200:350)}else{SFX.miss();helped=true;A.clear();A.msg(`The answer to this step is <b>${specText(st.a)}</b>. Type it to continue — you've got this! 💪`,'warn')}}})}
      else $('#rgo').onclick=quiz};draw()}

function resolveItem(it){if(it.p)return;const seen=B.cfg.seen||(B.cfg.seen=[]);const lv=adaptiveLv(it.g,it.ramp);let p,k;

function guidedQ(cur){const q=cur.q;let i=0,helpedAny=false;
  const head=`<div class="retban" style="background:#2e9d5b">🧭 Guided Mode — we'll solve it together, step by step</div><br>`;
  const draw=()=>{const allDone=i>=q.steps.length;
    $('#qtext').innerHTML=head+q.q+`<div class="steplist" style="font-size:16px;font-weight:600;text-align:left;margin-top:10px">${q.steps.map((st,j)=>`<div class="st ${j<i?'done':j===i?'cur':''}">${j<i?'✅':j===i?'👉':'⬜'} ${j<=i?st.q+(j<i?' → <b>'+specText(st.a)+'</b>':''):'Step '+(j+1)}</div>`).join('')}${allDone?'<div class="st cur">👉 Now the final answer to the question:</div>':''}</div>`;
    if(allDone){cur.guided=true;cur.tries=0;mountAsk($('#askbox'),{spec:q.a,fmt:q.fmt,label:'⚔️ Attack!',onDone:(r,v,A)=>{if(r.res==='ok')onAnswer(r,v,A);else{SFX.miss();A.clear();A.msg(`Look at your steps! The answer is <b>${specText(q.a)}</b>. Type it to attack.`,'warn')}}});return}
    const st=q.steps[i];let helped=false;const last=i===q.steps.length-1&&sameAns(st.a,q.a);
    mountAsk($('#askbox'),{spec:st.a,fmt:fmtOf(st.a),label:last?'⚔️ Attack!':'Next step ▶',onDone:(r,v,A)=>{
      if(r.res==='ok'){if(last){cur.guided=true;cur.tries=0;onAnswer(r,v,A)}else{SFX.coin();i++;draw()}}
      else{SFX.miss();helped=helpedAny=true;A.clear();A.msg(`This step's answer is <b>${specText(st.a)}</b>. Type it to keep going 💪`,'warn')}}})};
  draw()}

function skillReport(s){const gens=[s.g,...(s.also||[])];const tops=[...new Set(gens.map(g=>G[g].topic))];let n=0,f=0,t=0,resc=0;
  tops.forEach(tp=>{const st=P.stats[tp];if(st){n+=st.n;f+=st.first;t+=st.time;resc+=st.rescues}});
  const vals=gens.map(g=>P.sk[g]).filter(v=>v!=null);const lvl=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
  const A=P.assess&&P.assess.res&&P.assess.res[s.g];const acc=n?f/n:null;const avgT=n?t/n:(A&&A.time)||null;
  const help=tops.some(tp=>P.help[tp]);let cat;
  if(lvl==null&&!n)cat='new';
  else if(help||(lvl!=null&&lvl<1.5)||(n>=4&&acc<.6))cat='teach';
  else if((lvl!=null&&lvl<2.4)||(n>=4&&acc<.85))cat='exercise';
  else if(avgT&&avgT>s.slow)cat='time';
  else cat='strong';
  return{s,n,acc,avgT,lvl,cat,resc,help}}

function hasFilVoice(){try{if(window.AndroidTTS)return !!(AndroidTTS.hasFil&&AndroidTTS.hasFil());return !!VOICE.fil}catch(e){return false}}
function filToEn(t){return String(t).toLowerCase().replace(/\bmga\b/g,'MAHNGAH').replace(/\bmay\b/g,'MY').replace(/\bay\b/g,'EYE').replace(/[a-zñ]+/g,w=>{let s=w.replace(/ñ/g,'ny');s=s.replace(/ay\b/g,'#IGH#').replace(/aw\b/g,'#OW#').replace(/oy\b/g,'#OY#').replace(/iw\b/g,'#EEW#');s=s.replace(/a/g,'ah').replace(/e/g,'eh').replace(/i/g,'ee').replace(/o/g,'oh').replace(/u/g,'oo');return s.replace(/#IGH#/g,'igh').replace(/#OW#/g,'ow').replace(/#OY#/g,'oy').replace(/#EEW#/g,'eew')}).toLowerCase()}
function filPrep(t){const raw=String(t).trim();const letters=raw.replace(/[^a-zñ]/gi,'');const single=!/\s/.test(raw);
  if(hasFilVoice()){if(single&&letters.length<=2)return[filToEn(letters),'en'];return[raw.replace(/\bmga\b/gi,'manga').replace(/\bng\b/gi,'nang'),'fil']}   // Filipino voice: real words & sentences; only 1–2 letter syllables are respelled
  if(single&&(letters.length<=3||/^mga$/i.test(letters)))return[filToEn(letters),'en'];   // no Filipino voice: short words → sound-it-out spelling, English voice
  return[filToEn(raw),'en']}                                                              // no Filipino voice on this device → phonetic spelling

const stripTags=s=>String(s).replace(/<[^>]+>/g,'');
const T=(en,fil)=>(((YL&&YL.L&&YL.L.lang)||(BT&&BT.L&&BT.L.lang))==='fil'?fil:en);
const PRAISE_FIL=['Magaling!','Ang galing mo!','Tama!','Napakahusay!','Yehey!','Galing!'];
const praise=()=>pick(T(PRAISE,PRAISE_FIL));

function QI(q,opts,a,tip,o){return Object.assign({q,opts,a,tip},o||{})}
// "Q|opt1;opt2;opt3|answerIndex|tip" compact bank rows (emoji|label inside options use ~ as separator)
function QB(rows,o){return rows.map(r=>{const[q,op,a,tip]=r.split('#');return QI(q,op.split(';').map(x=>x.replace('~','|')),+a,tip,o)})}

// ---------- AUDIO: sound effects + battle music (Web Audio, no files) ----------
function actx(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
const sndOn=()=>P&&P.settings.sound!==false;

function mqListen(i){const kind=pick(i<3?['pitch','loud']:['pitch','loud','fast','long','updown']);const two=[{h:'<span class="kem">1️⃣</span><small>first</small>',v:0},{h:'<span class="kem">2️⃣</span><small>second</small>',v:1}];
  const mk=(s,q,sayq,ch,a,tip,why,gap)=>({html:`<div class="kq">🎧 ${q}</div>`,say:sayq,snd:s,auto:()=>playSeq(s,gap),ch,a,help:{html:`<p class="ktip">💡 ${tip} Tap 🔊 to listen again.</p>`,say:tip},why});
  if(kind==='pitch'){const lo=R(196,262),hi=lo*Math.pow(2,R(7,12)/12);const first=Math.random()<.5;const n=first?[hi,lo]:[lo,hi];const H=Math.random()<.5;return mk(n.map(f=>()=>mnote(f,.7,.13)),`Which sound is <u>${H?'HIGHER 🐦':'LOWER 🐻'}</u>?`,`Listen. Which sound is ${H?'higher':'lower'}?`,two,H?(first?0:1):(first?1:0),'High sounds are thin like a little bird. Low sounds are deep like a big bear.',`That one was ${H?'higher':'lower'}.`,1000)}
  if(kind==='loud'){const first=Math.random()<.5;const L=Math.random()<.5;const v=first?[.3,.03]:[.03,.3];return mk(v.map(x=>()=>mnote(330,.7,x)),`Which sound is <u>${L?'LOUD 📢':'SOFT 🤫'}</u>?`,`Listen. Which sound is ${L?'loud':'soft'}?`,two,L?(first?0:1):(first?1:0),'Loud sounds are big and strong. Soft sounds are quiet, like a whisper.',`That one was ${L?'loud':'soft'}.`,1000)}
  if(kind==='fast'){const first=Math.random()<.5;const F=Math.random()<.5;const p=first?[[8,.16],[4,.45]]:[[4,.45],[8,.16]];return mk(p.map(([n,g])=>()=>mclicks(n,g,.3)),`Which beat is <u>${F?'FAST 🐇':'SLOW 🐢'}</u>?`,`Listen. Which beat is ${F?'fast':'slow'}?`,two,F?(first?0:1):(first?1:0),'Fast beats come quickly like a rabbit. Slow beats take their time like a turtle.',`That one was ${F?'fast':'slow'}.`,2300)}
  if(kind==='long'){const first=Math.random()<.5;const Lg=Math.random()<.5;const d=first?[1.5,.2]:[.2,1.5];return mk(d.map(x=>()=>mnote(392,x,.13)),`Which sound is <u>${Lg?'LONGER':'SHORTER'}</u>?`,`Listen. Which sound is ${Lg?'longer':'shorter'}?`,two,Lg?(first?0:1):(first?1:0),'A long sound keeps going. A short sound stops quickly.',`That one was ${Lg?'longer':'shorter'}.`,1900)}
  const up=Math.random()<.5;const sc=[60,64,67,72];const s=[()=>(up?sc:sc.slice().reverse()).forEach((m,k)=>setTimeout(()=>mnote(mf(m),.35,.12),k*330))];
  return mk(s,'Did the music go UP or DOWN?','Listen. Did the music go up or down?',[{h:'<span class="kem">⬆️</span><small>up</small>',v:'u'},{h:'<span class="kem">⬇️</span><small>down</small>',v:'d'}],up?'u':'d','Going up sounds like climbing stairs. Going down sounds like sliding down.',`It went ${up?'up':'down'}.`)}

function mqTo100(i){const add=Math.random()<.5;let a,b;if(add){a=R(11,i<5?50:79);b=R(10,99-a);while((a%10)+(b%10)>9)b=R(10,99-a)}else{a=R(25,99);b=R(10,a-1);while((b%10)>(a%10))b=R(10,a-1)}const r=add?a+b:a-b;
  const col=`<pre class="col" style="font-size:30px">  ${a}\n${add?'+':'−'} ${b}\n────\n   ?</pre>`;const s=new Set([r,r+10,r-10,r+1]);const ch=shuffle([...s].filter(v=>v>=0).slice(0,3));if(!ch.includes(r))ch[0]=r;
  return{html:`<div class="kq">${a} ${add?'+':'−'} ${b} = ?</div>${col}`,say:`${a} ${add?'plus':'minus'} ${b}?`,ch:shuffle(ch).map(v=>({h:`<span class="kn">${v}</span>`,v})),a:r,
    help:{html:`<p class="ktip">💡 Ones first: ${a%10} ${add?'+':'−'} ${b%10} = ${add?(a%10)+(b%10):(a%10)-(b%10)}. Then tens: ${Math.floor(a/10)} ${add?'+':'−'} ${Math.floor(b/10)} = ${add?Math.floor(a/10)+Math.floor(b/10):Math.floor(a/10)-Math.floor(b/10)}.</p>`,say:`Do the ones first, then the tens.`},why:`${a} ${add?'+':'−'} ${b} = ${r}.`}}

  const r=add?a+b:a-b;const q=add?`${n} has ${a} ${t}. ${pick(['Nanay','Tatay','A friend','Lolo'])} gives ${n} ${b} more. How many ${t} does ${n} have now?`:`${n} picked ${a} ${t}. ${n} gave ${b} to a neighbor. How many ${t} are left?`;

function g2Regroup(i){const add=Math.random()<.55;let a,b;if(add){do{a=R(15,79);b=R(12,99-a)}while((a%10)+(b%10)<10||a+b>99)}else{do{a=R(31,99);b=R(12,a-10)}while((b%10)<=(a%10))}const r=add?a+b:a-b;

  const ds=String(n).split('');const k=R(0,2);const d=+ds[k];if(!d)return g2Thousand(i);const val=d*[100,10,1][k];const s=new Set([val,d,d*(k===0?10:100)]);return{html:`<div class="kq">What is the value of the <u>${d}</u> in <b>${ds.map((c,j)=>j===k?`<span style="color:#d64541">${c}</span>`:c).join('')}</b>?</div>`,say:`What is the value of the ${d} in ${n}?`,ch:shuffle([...s]).map(v=>({h:`<span class="kn">${v}</span>`,v})),a:val,help:{html:'<p class="ktip">💡 Hundreds · Tens · Ones — which place is it in?</p>',say:'Is it in the hundreds, tens or ones place?'},why:`The ${d} is in the ${['hundreds','tens','ones'][k]} place, so it is ${val}.`}}

function renderTrace(){const it=YL.items[YL.i];if(!it){endLesson();return}it.tries=0;YL.cur={done:false};const t=it.t;
  screen(yHead()+`<div class="card kcard center"><div class="kq">✍️ Trace ${t.length>1?'the word':'the '+(/[0-9]/.test(t)?'number':'letter')}: <span style="color:#1f4e9e">${esc(t)}</span></div><p class="muted" style="margin:2px 0">Use your finger. Cover the gray ${t.length>1?'letters':'shape'}. Start at the top! ⬇️</p>

function trSetup(t){const c=$('#tc');const W=t.length>2?720:420,H=360;c.width=W;c.height=H;const ctx=c.getContext('2d');const fs=Math.min(300,(W-40)/Math.max(1,t.length*.62));
  const font=`bold ${fs}px "Comic Sans MS","Chalkboard SE","Comic Neue",Arial,sans-serif`;
  const draw=()=>{ctx.fillStyle='#fffdf5';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#9ad1f5';ctx.lineWidth=3;ctx.setLineDash([]);[60,H-60].forEach(y=>{ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()});ctx.setLineDash([12,10]);ctx.beginPath();ctx.moveTo(0,H/2+10);ctx.lineTo(W,H/2+10);ctx.stroke();
    ctx.setLineDash([]);ctx.font=font;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#e6dcc6';ctx.fillText(t,W/2,H-62);ctx.setLineDash([3,9]);ctx.lineWidth=3;ctx.strokeStyle='#a8916a';ctx.strokeText(t,W/2,H-62);ctx.setLineDash([])};
  draw();const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');o.font=font;o.textAlign='center';o.textBaseline='alphabetic';o.fillStyle='#000';o.fillText(t,W/2,H-62);
  const d=o.getImageData(0,0,W,H).data;const CS=12,gw=Math.ceil(W/CS),gh=Math.ceil(H/CS);const guide=new Set();for(let y=0;y<H;y+=4)for(let x=0;x<W;x+=4){if(d[(y*W+x)*4+3]>100)guide.add(Math.floor(x/CS)+','+Math.floor(y/CS))}
  const near=new Set();guide.forEach(k=>{const[x,y]=k.split(',').map(Number);for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++)near.add((x+a)+','+(y+b))});
  TR={c,ctx,W,H,draw,guide,near,drawn:new Set(),pts:0,last:null,col:pick(['#1e63d6','#e53935','#8e24aa','#43a047']),lw:Math.max(16,fs*.11),CS};
  const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  const mark=(x,y)=>{const rr=Math.ceil(TR.lw/2/CS);const cx=Math.floor(x/CS),cy=Math.floor(y/CS);for(let a=-rr;a<=rr;a++)for(let b=-rr;b<=rr;b++)TR.drawn.add((cx+a)+','+(cy+b))};
  const line=(p)=>{ctx.strokeStyle=TR.col;ctx.lineWidth=TR.lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(...TR.last);ctx.lineTo(...p);ctx.stroke();const n=Math.ceil(Math.hypot(p[0]-TR.last[0],p[1]-TR.last[1])/5);for(let k=0;k<=n;k++)mark(TR.last[0]+(p[0]-TR.last[0])*k/n,TR.last[1]+(p[1]-TR.last[1])*k/n);TR.last=p;TR.pts++};
  c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);TR.last=pos(e);line(pos(e))};c.onpointermove=e=>{if(!TR.last)return;e.preventDefault();line(pos(e))};c.onpointerup=c.onpointercancel=()=>{TR.last=null}}
function trClear(){if(!TR)return;TR.draw();TR.drawn=new Set();TR.pts=0}
function trCheck(){const C=YL.cur;if(C.done||!TR)return;const it=YL.items[YL.i];let cov=0;TR.guide.forEach(k=>{if(TR.drawn.has(k))cov++});const cover=cov/Math.max(1,TR.guide.size);let stray=0;TR.drawn.forEach(k=>{if(!TR.near.has(k))stray++});const sr=stray/Math.max(1,TR.drawn.size);

function bzKilo(i){const G=pick(GOODS);if(i<6){const kg=R(1,5);return{html:`<div class="kq">⚖️ How many kilograms (kg) of ${G[1]}?</div>${dialSVG(kg,5,'kg',G[0].repeat(Math.min(kg,3)))}`,say:`Look at the scale. How many kilograms of ${G[1]}? Look where the blue needle points.`,ch:numCh(kg,0,6).map(c=>({h:`<span class="kn">${c.v}</span><small>kg</small>`,v:c.v})),a:kg,help:{html:'<p class="ktip">💡 Follow the blue needle to the number it points at.</p>',say:'Follow the blue needle to the number.'},why:`The needle points to ${kg}. That is ${kg} kilograms.`}}

function bzPayKilo(i){const G=pick(GOODS.filter(x=>i<5?x[2]<=80:true));const kg=R(1,i<5?2:3);const pay=G[2]*kg;const s=new Set([pay,G[2],pay+G[2]]);if(s.size<3)s.add(pay+10);

  if(t.length>=7&&lev(t,tok)<=1)return 2;               // long words: tolerate one slip of the recognizer
  if(t.length>=3&&tok.length===t.length+1&&tok.startsWith(t)&&/[sd]$/.test(tok))return 2; // "bans","band" for "ban"
  if(t.length>=6&&lev(t,tok)<=2)return 1;
  if(t.length>=3&&lev(t,tok)===1&&tok[0]===t[0])return 1; // ban → bun: close, but the vowel matters
  return 0}

  const a=R(1,d-2),b=R(1,d-1-a);return{html:`<div class="kq">${fr(a,d)} + ${fr(b,d)} = ?</div>`,say:`${a} over ${d} plus ${b} over ${d}?`,ch:chT(fr(a+b,d),[fr(a+b,d+d),fr(a+b+1,d),fr(a*b,d)]).map(c=>({h:`<span class="kn${String(c.v).length>5?' sm':''}">${c.v}</span>`,v:c.v})),a:fr(a+b,d),help:{html:'<p class="ktip">💡 Same bottom number: add only the tops. Keep the bottom.</p>',say:'Add the top numbers. Keep the bottom number.'},why:`${fr(a,d)} + ${fr(b,d)} = ${fr(a+b,d)}`}}
function dec4(i){if(i%2===0){const h=R(1,99);const d=(h/100).toFixed(2);return{html:`<div class="kq">${h}/100 written as a decimal is…</div>`,say:`${h} hundredths as a decimal?`,ch:chT(d,[(h/10).toFixed(1),'0.'+String(h).padStart(3,'0'),String(h)]).map(c=>({h:`<span class="kn${String(c.v).length>5?' sm':''}">${c.v}</span>`,v:c.v})),a:d,help:{html:'<p class="ktip">💡 Hundredths have 2 digits after the decimal point.</p>',say:'Hundredths have two digits after the decimal point.'},why:`${h}/100 = ${d}`}}
  let a=R(1,99)/100,b=R(1,99)/100;while(a===b)b=R(1,99)/100;return{html:'<div class="kq">Which decimal is GREATER?</div>',say:'Which decimal is greater?',ch:[{h:`<span class="kn">${a.toFixed(2)}</span>`,v:a},{h:`<span class="kn">${b.toFixed(2)}</span>`,v:b}],a:Math.max(a,b),help:{html:'<p class="ktip">💡 Compare tenths first, then hundredths.</p>',say:'Compare the tenths first, then the hundredths.'},why:`${Math.max(a,b).toFixed(2)} > ${Math.min(a,b).toFixed(2)}`}}

function angSVG(d){const r=d*Math.PI/180;return `<svg viewBox="0 0 140 90" width="140" height="90"><line x1="20" y1="80" x2="130" y2="80" stroke="#1f4e9e" stroke-width="5" stroke-linecap="round"/><line x1="20" y1="80" x2="${20+90*Math.cos(r)}" y2="${80-90*Math.sin(r)}" stroke="#d64541" stroke-width="5" stroke-linecap="round"/><path d="M45 80 A25 25 0 0 0 ${20+25*Math.cos(r)} ${80-25*Math.sin(r)}" fill="none" stroke="#2e9d5b" stroke-width="3"/></svg>`}
function angles(i){const t=pick(['right','acute','obtuse']);const d=t==='right'?90:t==='acute'?R(25,70):R(110,160);return{html:`<div class="kq">What kind of angle is this?</div>${angSVG(d)}`,say:'What kind of angle is this?',ch:['acute','right','obtuse'].map(v=>({h:`<span class="kword sm">${v}</span><small>${v==='acute'?'less than 90°':v==='right'?'exactly 90°':'more than 90°'}</small>`,v})),a:t,help:{html:'<p class="ktip">💡 A right angle is a square corner (90°). Smaller = acute. Bigger = obtuse.</p>',say:'A right angle is a square corner. Smaller is acute. Bigger is obtuse.'},why:`It is ${t} (about ${d}°).`}}

      ko: ['ko', 'koh', 'co'],          ku: ['ku', 'koo', 'coo'],
      // 3-letter words: same-sound spellings only
      cat: ['cat', 'kat'],  sun: ['sun', 'son'],  bin: ['bin'],  pup: ['pup'],
      bun: ['bun', 'bunn'], net: ['net', 'nett'], rug: ['rug'],  mop: ['mop']
    };
    for (const k in EXTRA_SAME) {
      const prev = Array.isArray(SAMEAS[k]) ? SAMEAS[k] : [];
      SAMEAS[k] = Array.from(new Set([...prev, ...EXTRA_SAME[k]]));
    }
    // Remove cross-collisions an older list may contain (one spelling counted for two sounds).
    // "bee" is bi, not be; "pa" is not ba; "and" is not an/en.
    const STRIP = { be: ['bee', 'b'], ba: ['pa'], an: ['and'], en: ['and', 'in'], in: ['en'], it: ['at', 'eat'], et: ['at', 'eat'] };
    for (const k in STRIP) if (Array.isArray(SAMEAS[k])) SAMEAS[k] = SAMEAS[k].filter(x => !STRIP[k].includes(x));
  });

  // ---------- 5. "@" → "at", "&" → "and" before symbols are stripped ----------
  step('micNorm symbols', () => {
    if (!(typeof micNorm !== 'undefined')) return;
    const _origMicNorm = micNorm;
    micNorm = function (s) {
      return _origMicNorm(String(s == null ? '' : s).replace(/@/g, ' at ').replace(/&/g, ' and '));
    };
  });

  // ---------- 6. listen(): TTS cooldown, interim results, error normalising, no timer leaks ----------
  step('listen', () => {
    if (!(typeof listen !== 'undefined') || typeof STT === 'undefined') return;
    let sttTimer = null, startTimer = null, callNo = 0;
    const ready = () => { try { window.__sttReady && window.__sttReady(); } catch (e) {} };

    listen = function (lang) {
      try { (typeof sayStop !== 'undefined') && sayStop(); } catch (e) {}
      try { (typeof micStop !== 'undefined') && micStop(); } catch (e) {}
      clearTimeout(sttTimer); clearTimeout(startTimer);
      const my = ++callNo;                    // a newer listen() cancels this one before it starts
      STT.busy = true;
      const loc = lang === 'fil' ? 'fil-PH' : 'en-US';
      const done = v => { if (my === callNo) { STT.busy = false; clearTimeout(sttTimer); } return v; };

      return new Promise(resolve => {
        // 220 ms lets phone audio switch from speaker (TTS) to microphone cleanly
        startTimer = setTimeout(() => {
          if (my !== callNo) return resolve({ err: 'aborted' });

          // --- Android APK: native SpeechRecognizer bridge ---
          if (window.AndroidSTT) {
            const id = 's' + (++STT.n);
            STT.cb[id] = v => resolve(done(v));
            try { AndroidSTT.listen(loc, id); }
            catch (e) { delete STT.cb[id]; return resolve(done({ err: 'bridge' })); }
            sttTimer = setTimeout(() => {
              if (STT.cb[id]) {
                try { AndroidSTT.cancel(); } catch (e) {}
                if (window.__sttError) window.__sttError(id, 'timeout');
                else { const cb = STT.cb[id]; delete STT.cb[id]; cb({ err: 'no-speech' }); }
              }
            }, 14000);
            return;
          }

          // --- Browser: Web Speech API ---
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) return resolve(done({ err: 'none' }));

          let fin = false, finalAlts = [], interimAlts = [], settle = null, r = null;
          const end = v => {
            if (fin) return;
            fin = true;
            clearTimeout(settle);
            if (STT.web === r) STT.web = null;
            resolve(done(v));
          };
          const all = () => [...new Set([...finalAlts, ...interimAlts])];

          try {
            r = new SR();
            STT.web = r;
            r.lang = loc;
            r.maxAlternatives = 5;
            r.interimResults = true;          // short kid words often only show up as interim
            r.continuous = false;

            r.onstart = ready;
            r.onresult = e => {
              for (let i = e.resultIndex; i < e.results.length; i++) {
                const res = e.results[i];
                const t = Array.from(res).map(a => (a.transcript || '').trim()).filter(Boolean);
                if (res.isFinal) finalAlts.push(...t); else if (t.length) interimAlts = t;
              }
              if (finalAlts.length) return end({ alts: all() });
              if (interimAlts.length) {        // engine heard something but is slow to finalise
                clearTimeout(settle);
                settle = setTimeout(() => { try { r.stop(); } catch (er) {} end({ alts: all() }); }, 900);
              }
            };
            r.onerror = e => {
              const code = (e && e.error) || 'err';
              if ((code === 'no-speech' || code === 'aborted') && (finalAlts.length || interimAlts.length)) return end({ alts: all() });
              if (code === 'language-not-supported') return end({ err: 'nolang' });  // lets callers fall back to en-US
              end({ err: code });
            };
            r.onend = () => end(finalAlts.length || interimAlts.length ? { alts: all() } : { err: 'no-speech' });

            r.start();
            sttTimer = setTimeout(() => { try { r.stop(); } catch (e) {} }, 8500);
          } catch (e) {
            end({ err: 'start' });
          }
        }, 220);
      });
    };
  });

  // ---------- 7. brScore: accept a homophone only when it is the WHOLE answer ----------
  // (Gemini's version accepted any word inside a longer phrase, e.g. "the hat is red" for "at".)
  step('brScore', () => {
    if (!(typeof brScore !== 'undefined') || !(typeof micNorm !== 'undefined')) return;
    const _origBrScore = brScore;
    brScore = function (t, alts) {
      const base = _origBrScore(t, alts);
      if (base && base.score === 2) return base;
      const target = micNorm(t).replace(/ /g, '');
      const accepted = (typeof SAMEAS !== 'undefined' && Array.isArray(SAMEAS[target])) ? SAMEAS[target] : [];
      for (const a of (alts || [])) {
        const n = micNorm(a);
        const toks = n.split(' ').filter(Boolean);
        if (!toks.length || toks.length > 2) continue;      // ignore long phrases / chatter
        // allow "at" or "at at" (kids repeat), but never "c a t" (letters must be blended)
        const w = toks[0];
        if (toks.length === 2 && toks[1] !== w) continue;
        if (w === target || accepted.includes(w)) return { score: 2, heard: n, why: '' };
      }
      return base;
    };
  });

  // ---------- 8. Never delete the 🎤 button when the browser blocks auto-listening ----------
  const BLOCKED = ['not-allowed', 'start', 'service-not-allowed'];

  step('micGo', () => {
    if (!(typeof micGo !== 'undefined') || !(typeof micWord !== 'undefined')) return;
    micGo = async function (kind, btn) {
      if (!btn || btn.dataset.busy || typeof YL === 'undefined' || !YL) return;
      const it = YL.items[YL.i];
      const tok = YL.tok;
      const lang = YL.L && YL.L.lang === 'fil' ? 'fil' : 'en';
      const target = kind === 'page' ? it.p[1] : it.w.w;
      btn.dataset.busy = 1;
      btn.classList.add('listen');
      btn.classList.remove('pulse');
      btn.innerHTML = `👂 ${T('Listening… say it now!', 'Nakikinig… sabihin na!')} <span class="mbars"><i></i><i></i><i></i></span>`;
      P.yk.mic = P.yk.mic || { n: 0, ok: 0 };
      P.yk.mic.n++;

      let r = await listen(lang);
      if (r.err === 'nolang' && lang === 'fil') r = await listen('en');
      if (!YL || YL.tok !== tok || !btn.isConnected) return;
      btn.classList.remove('listen', 'hot');
      delete btn.dataset.busy;

      if (r.err) {
        YL.cur.mt = (YL.cur.mt || 0) + 1;
        if (BLOCKED.includes(r.err)) {
          btn.classList.add('pulse');
          btn.innerHTML = '🎤 ' + T('Tap here & say it!', 'Pindutin ito at sabihin!');
          micFb(T('👆 Tap the red 🎤 button, allow the microphone if asked, and speak!', '👆 Pindutin ang pulang 🎤, payagan ang mikropono, at magsalita!'), 'warn');
          if (YL.cur.mt >= 2 && kind === 'word') micReveal();
          return;
        }
        const m = micErrMsg(r.err);
        if (kind === 'word' && (m || YL.cur.mt >= 3)) micReveal();
        if (m) { toast(m); btn.classList.add('pulse'); btn.innerHTML = '🎤 ' + T('Tap to try again', 'Subukan muli'); return; }
        btn.classList.add('pulse');
        btn.innerHTML = '🎤 ' + T("I didn't hear you — tap & say it!", 'Hindi kita narinig — pindutin at ulitin!');
        say(T('Tap the microphone and say it loud!', 'Pindutin ang mikropono at lakasan mo!'), .9);
        return;
      }
      if (kind === 'page') return micPage(btn, target, r.alts, lang);
      return micWord(kind, btn, target, r.alts, lang);
    };
  });

  step('brListen', () => {
    if (!(typeof brListen !== 'undefined') || !(typeof brRight !== 'undefined') || !(typeof brWrong !== 'undefined')) return;
    brListen = async function (btn) {
      if (typeof YL === 'undefined' || !YL || !btn || btn.dataset.busy) return;
      const it = YL.items[YL.i], tok = YL.tok, k = it.kind;
      btn.dataset.busy = 1;
      btn.classList.add('listen');
      btn.classList.remove('pulse');
      btn.innerHTML = `👂 Listening… say it now! <span class="mbars"><i></i><i></i><i></i></span>`;
      P.yk.mic = P.yk.mic || { n: 0, ok: 0 };
      P.yk.mic.n++;

      let r = await listen(it.lang);
      if (r.err === 'nolang' && it.lang === 'fil') r = await listen('en');
      if (!YL || YL.tok !== tok || !btn.isConnected) return;
      delete btn.dataset.busy;
      btn.classList.remove('listen');

      if (r.err) {
        if (BLOCKED.includes(r.err)) {
          it.blk = (it.blk || 0) + 1;
          if (it.blk >= 3) { brNoMic(); return; }  // mic truly refused → read-along instead of a dead end
          btn.innerHTML = '🎤 Tap here & say it!';
          btn.classList.add('pulse');
          micFb('👆 Tap the red 🎤 button (and press Allow if your browser asks for the mic)!', 'warn');
          return;
        }
        const m = micErrMsg(r.err);
        if (m) { toast(m); brNoMic(); return; }   // device really can't listen → read-along mode
        it.quiet = (it.quiet || 0) + 1;
        btn.innerHTML = '🎤 Tap me and say it!';
        btn.classList.add('pulse');
        micFb('🗣️ Speak right after the red button turns on!', 'warn');
        say('Tap the red button and say it loud!', .9);
        return;
      }
      const s = k === 'sent' ? brSentScore(it.t, r.alts, it.lang) : brScore(it.t, r.alts);
      if (k === 'sent') (s.hit || []).forEach((h, j) => {
        const el = $('#brw' + j);
        if (el) { el.classList.remove('miss', 'said'); el.classList.add(h ? 'said' : 'miss'); }
      });
      if (s.score === 2) { P.yk.mic.ok++; brRight(); return; }
      brWrong(s);
    };
  });

  console.info('[TUDLO] voice fix v6.7.1 loaded');
})();
// ================= end of voice fix =================

// ---------- boot ----------
load();
if(STORE.current&&STORE.profiles[STORE.current]){P=STORE.profiles[STORE.current];migrate();P.young?scrYoung():scrKingdom()}else scrTitle();

</script>
